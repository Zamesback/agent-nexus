async function sendToTerminal() {
  const input = document.getElementById('dshInput');
  const btn = document.getElementById('dshSendBtn');
  const text = (input.value || '').trim();
  if (!text) return;
  input.value = '';
  dshAppend('user', text);
  dshMsgsCache.push({ role: 'user', content: text });  // v2.17：用户消息进缓存（服务端已同步落盘）
  btn.disabled = true; btn.textContent = '回复中…';
  const h = dshHistory();
  const histCtx = h.slice(-4).map(m => (m.role === 'user' ? '你' : '终端 Agent') + '：' + (m.content || '')).join('\n');
  const payload = { message: text, context: histCtx || '', session_id: '' };  // v2.17：纯消息落盘，上下文独立传
  try {
    const resp = await fetch('/api/dsh/chat' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : '') + '&agent=' + encodeURIComponent(currentDshAgent || 'terminal'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      dshAppend('assistant', '⚠️ ' + (err.error || ('HTTP ' + resp.status)));
      return;
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let gotReply = false;
    let replyContent = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const raw of lines) {
        if (!raw.startsWith('data: ')) continue;
        let ev; try { ev = JSON.parse(raw.slice(6)); } catch (e) { continue; }
        const t = ev.type;
        if (t === 'session') continue;
        if (t === 'status') {  // v2.19.3：步骤进展可见——「正在工作中 · 第 N 步」
          const ph = ev.phase || '';
          const act = document.getElementById('dshActivity');
          if (ph === 'step_start') {
            if (act) act.innerHTML = '<span class="who">终端 Agent</span>⏳ 正在工作中 · 第 ' + (ev.step || 1) + ' 步…';
            else {
              const box = document.getElementById('dshMsgs');
              if (box) box.insertAdjacentHTML('beforeend', '<div class="dsh-msg thinking" id="dshActivity"><span class="who">终端 Agent</span>⏳ 正在工作中 · 第 ' + (ev.step || 1) + ' 步…</div>');
            }
          } else if (ph === 'turn_end' && act) {
            act.remove();
          }
          continue;
        }
        if (t === 'thinking') {  // v2.19.3：思考过程折叠可见（可展开）
          appendThinking(ev.text);
          continue;
        }
        if (t === 'approval') {
          renderApproval(ev);
          continue;
        }
        if (t === 'approval_expired') {  // v2.20.6：桥接超时回报——让卡片失效
          expireApprovalCard(ev.requestId, '已超时自动拒绝');
          continue;
        }
        if (t === 'approval_late') {  // v2.20.6：迟到应答回报——覆盖掉可能已显示的「已批准」
          markApprovalLate(ev.requestId, ev.option);
          continue;
        }
        if (t === 'dsh_error') {  // v2.19.3：模型/上游错误可见，不再静默卡住
          const act = document.getElementById('dshActivity'); if (act) act.remove();
          dshAppend('assistant', '⚠️ ' + (ev.error || '会话异常'));
          gotReply = true;
          continue;
        }
        if (t === 'text') {
          const act = document.getElementById('dshActivity'); if (act) act.remove();
          replyContent = ev.text || '';
          if (!gotReply) { dshAppend('assistant', replyContent); gotReply = true; }
          else {
            const box = document.getElementById('dshMsgs');
            const last = box ? box.lastElementChild : null;
            if (last && last.classList.contains('dsh-msg')) dshSetBody(last, 'assistant', replyContent);
          }
          continue;
        }
        if (t === 'final') {
          if (ev.text && ev.text !== replyContent) {
            replyContent = ev.text;
            const box = document.getElementById('dshMsgs');
            const last = box ? box.lastElementChild : null;
            if (last && last.classList.contains('dsh-msg')) dshSetBody(last, 'assistant', replyContent);
          }
          continue;
        }
        if (t === 'dsh_done') {
          const act = document.getElementById('dshActivity'); if (act) act.remove();  // v2.19.3 兜底
          if (!ev.ok && replyContent === '' && !gotReply) dshAppend('assistant', '⚠️ 会话未完成（超时或进程中断），没有产出回复。');  // v2.19.3 不再静默
          const usage = ev.usage || {};
          const total = ev.total_usage || {};
          dshMsgsCache.push({ role: 'assistant', content: replyContent, usage: { inputTokens: usage.inputTokens || 0, outputTokens: usage.outputTokens || 0, totalTokens: usage.totalTokens || 0 } });
          dshServerUsage = total;  // v2.17：用量以服务端为准
          const box = document.getElementById('dshMsgs');
          if (box && box.lastElementChild) {
            box.lastElementChild.insertAdjacentHTML('beforeend', `<div class="dsh-usage">⟐ in ${fmtTokens(usage.inputTokens || 0)} / out ${fmtTokens(usage.outputTokens || 0)} / 累计 ${fmtTokens(total.totalTokens || 0)}</div>`);
          }
          document.getElementById('dshUsage').textContent = '用量：' + fmtTokens((total.inputTokens||0) + (total.outputTokens||0));
        }
      }
    }
  } catch (e) {
    dshAppend('assistant', '⚠️ 连接中断：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '发送';
  }
}

/* ===== 权限审批（v2.18 进程托管批准闭环 / v2.20.6 提示音 + 超时可见） ===== */
const APV_SOUND_KEY = 'agentnexus_approval_sound';
let apvAudioCtx = null;
const apvAlerts = {};          // requestId -> 重复提醒定时器

function apvSoundEnabled() {
  try { return localStorage.getItem(APV_SOUND_KEY) !== 'off'; } catch (e) { return true; }
}
function toggleApvSoundUI() {
  const on = !apvSoundEnabled();
  try { localStorage.setItem(APV_SOUND_KEY, on ? 'on' : 'off'); } catch (e) {}
  if (!on) Object.keys(apvAlerts).forEach(stopApprovalAlert);
  syncApvSoundBtn();
}
function syncApvSoundBtn() {
  const b = document.getElementById('apvSoundBtn');
  if (b) b.textContent = apvSoundEnabled() ? '🔔 提醒开' : '🔕 提醒关';
}
// 浏览器要求先有用户手势才允许发声：首次交互时解锁 AudioContext
function apvUnlockAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!apvAudioCtx) apvAudioCtx = new AC();
    if (apvAudioCtx.state === 'suspended') apvAudioCtx.resume();
  } catch (e) {}
}
// 三声上行提示音（WebAudio 合成，不依赖外部音频文件）
function playApprovalChime() {
  try {
    if (!apvAudioCtx || apvAudioCtx.state !== 'running') return;
    const now = apvAudioCtx.currentTime;
    [[880, 0], [1174.7, 0.16], [1568, 0.32]].forEach(function (pair) {
      const osc = apvAudioCtx.createOscillator(), g = apvAudioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = pair[0];
      g.gain.setValueAtTime(0.0001, now + pair[1]);
      g.gain.exponentialRampToValueAtTime(0.3, now + pair[1] + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + pair[1] + 0.3);
      osc.connect(g); g.connect(apvAudioCtx.destination);
      osc.start(now + pair[1]); osc.stop(now + pair[1] + 0.32);
    });
  } catch (e) {}
}
function notifyDesktop(title, body) {
  try {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    const n = new Notification(title, { body: body, tag: 'agentnexus-approval' });
    n.onclick = function () { try { window.focus(); n.close(); } catch (e) {} };
  } catch (e) {}
}
function refreshApvTitle() {
  const n = Object.keys(apvAlerts).length;
  document.title = n > 0 ? ('⚠️ 待批准 ' + n + ' · AgentNexus') : 'AgentNexus';
}
function startApprovalAlert(rid, toolName) {
  if (apvAlerts[rid]) return;
  if (apvSoundEnabled()) playApprovalChime();
  notifyDesktop('AgentNexus · 需要你批准', (toolName || '工具') + ' 请求权限升级');
  apvAlerts[rid] = setInterval(function () {
    if (apvSoundEnabled()) playApprovalChime();
  }, 8000);   // 未处理就每 8 秒再响一次——人不在界面也能被叫回来
  refreshApvTitle();
}
function stopApprovalAlert(rid) {
  if (apvAlerts[rid]) { clearInterval(apvAlerts[rid]); delete apvAlerts[rid]; }
  refreshApvTitle();
}
function apvTimeoutText(ms) {
  const s = Math.round(ms / 1000);
  if (s < 60) return s + ' 秒';
  return (s % 60 === 0) ? (s / 60) + ' 分钟' : Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒';
}
function pruneApprovalCards() {
  const list = document.getElementById('dshApprovalList');
  if (!list) return;
  Array.prototype.slice.call(list.children).forEach(function (c) {
    if (c.dataset && c.dataset.done === '1') c.remove();
  });
}
// v2.20.6：让卡片真的失效——超时后按钮必须消失，不能继续假装还能批准
function expireApprovalCard(rid, msg) {
  stopApprovalAlert(rid);
  const card = document.getElementById('apv-' + rid);
  if (!card || card.dataset.done === '1') return;
  card.dataset.done = '1';
  card.classList.add('apv-done-reject');
  const toolEl = card.querySelector('.apv-tool');
  const toolTxt = (toolEl && toolEl.textContent) || '';
  const acts = card.querySelector('.apv-actions');
  if (acts) acts.innerHTML = '<span class="apv-done">⌛ ' + esc(msg || '已超时自动拒绝') + '</span>';
  const head = card.querySelector('.apv-head');
  if (head) head.textContent = '⌛ 已超时 · ' + toolTxt;
  const tip = card.querySelector('.apv-tip');
  if (tip) tip.textContent = '本轮已按「拒绝」继续。若仍需该操作，请重新触发。';
}

// v2.20.6：应答「太晚」的兜底修正。服务端有 3 秒宽限窗，用户点批准后可能先看到
// 「✓ 已批准」，随后桥接才回报 late——这里必须覆盖掉那句谎话，而不是只改 tip。
function markApprovalLate(rid, option) {
  stopApprovalAlert(rid);
  const card = document.getElementById('apv-' + rid);
  if (!card) return;
  card.dataset.done = '1';
  card.classList.remove('apv-done-allow');
  card.classList.add('apv-done-reject');
  const toolEl = card.querySelector('.apv-tool');
  const toolTxt = (toolEl && toolEl.textContent) || '';
  const acts = card.querySelector('.apv-actions');
  if (acts) acts.innerHTML = '<span class="apv-done">⚠️ 应答太晚，未生效</span>';
  const head = card.querySelector('.apv-head');
  if (head) head.textContent = '⚠️ 已超时 · ' + toolTxt;
  let tip = card.querySelector('.apv-tip');
  if (!tip) { tip = document.createElement('div'); tip.className = 'apv-tip'; card.appendChild(tip); }
  tip.textContent = '你的「' + (option === 'allow' ? '批准' : '拒绝') +
    '」到达时该请求已超时失效——Agent 已按「拒绝」继续本轮。若仍需该操作，请重新触发。';
}

function renderApproval(ev) {
  const list = document.getElementById('dshApprovalList');
  if (!list) return;
  const rid = ev.requestId || ('r' + Date.now());
  if (document.getElementById('apv-' + rid)) return;  // 去重
  pruneApprovalCards();
  const toolName = ev.toolName || '工具';
  const reason = ev.reason || '';
  // v2.20.6：超时值由桥接回报（= profile 实际配置），不再硬编码「5 分钟」
  const tmoMs = Number(ev.timeoutMs) > 0 ? Number(ev.timeoutMs) : 300000;
  const tmoText = apvTimeoutText(tmoMs);
  const card = document.createElement('div');
  card.className = 'dsh-approval';
  card.id = 'apv-' + rid;
  card.innerHTML =
    '<div class="apv-head">⚠️ 需要你的批准 · <span class="apv-tool">' + esc(toolName) + '</span></div>' +
    '<div class="apv-reason">' + esc(reason || '执行此操作需要权限升级') + '</div>' +
    '<div class="apv-actions">' +
      '<button class="btn mini" onclick="approveDshRequest(\'' + rid + '\',\'allow\',this)">批准</button>' +
      '<button class="btn mini danger" onclick="approveDshRequest(\'' + rid + '\',\'reject\',this)">拒绝</button>' +
    '</div>' +
    '<div class="apv-tip">' + tmoText + '内未操作将自动拒绝（安全默认）· 剩余 <b id="apv-cd-' + rid + '">' + tmoText + '</b></div>';
  list.appendChild(card);
  list.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  startApprovalAlert(rid, toolName);
  // 本地倒计时兜底：桥接进程可能已退出，收不到 approval_expired 事件
  const deadline = Date.now() + tmoMs;
  const tick = setInterval(function () {
    const left = Math.max(0, Math.round((deadline - Date.now()) / 1000));
    const el = document.getElementById('apv-cd-' + rid);
    if (el) el.textContent = left >= 60 ? (Math.floor(left / 60) + ' 分 ' + (left % 60) + ' 秒') : (left + ' 秒');
    if (left <= 0) { clearInterval(tick); expireApprovalCard(rid, '已超时自动拒绝'); }
  }, 1000);
}

// v2.20.6：首次用户手势时解锁音频 + 申请桌面通知权限（否则离开界面时听不到提示）
['click', 'keydown', 'pointerdown'].forEach(function (e) {
  window.addEventListener(e, function () {
    apvUnlockAudio();
    try {
      if (typeof Notification !== 'undefined' && Notification.permission === 'default') Notification.requestPermission();
    } catch (_e) {}
  }, { passive: true });
});

async function approveDshRequest(requestId, option, btn) {
  if (!btn) return;
  btn.disabled = true;
  const card = btn.closest('.dsh-approval');
  try {
    const resp = await fetch('/api/dsh/approve' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requestId, option })
    });
    const r = await resp.json().catch(() => ({}));
    if (!r.ok) {
      if (r.stale) {  // v2.20.6：请求已失效——如实告知，不再假装「已批准」
        expireApprovalCard(requestId, '已超时失效');
        const st = card && card.querySelector('.apv-tip');
        if (st) st.textContent = '⚠️ ' + (r.error || '该审批请求已失效');
        return;
      }
      const tip = (card && card.querySelector('.apv-tip')) ||
                  (btn.parentElement && btn.parentElement.querySelector('.apv-tip'));
      if (tip) tip.textContent = '⚠️ 应答失败：' + (r.error || 'HTTP ' + resp.status);
      btn.disabled = false;
      return;
    }
    stopApprovalAlert(requestId);
    if (card) {
      card.dataset.done = '1';
      card.classList.add(option === 'allow' ? 'apv-done-allow' : 'apv-done-reject');
      const acts = card.querySelector('.apv-actions');
      if (acts) acts.innerHTML = '<span class="apv-done">' + (option === 'allow' ? '✓ 已批准，继续执行' : '✕ 已拒绝') + '</span>';
      const tip = card.querySelector('.apv-tip');
      if (tip) tip.remove();
      const head = card.querySelector('.apv-head');
      if (head) head.textContent = (option === 'allow' ? '✓ 已批准' : '✕ 已拒绝') + ' · ' + esc((card.querySelector('.apv-tool')||{}).textContent || '');
    }
  } catch (e) {
    const tip = btn.parentElement.querySelector('.apv-tip');
    if (tip) tip.textContent = '⚠️ 应答失败：' + e.message;
    btn.disabled = false;
  }
}

/* ===== 讨论室 v2.20 ===== */
let discussCtrl = null;        // AbortController（隐藏视图时断开 SSE，讨论在后台继续）
let discussEnded = false;

function isTerminalMember(a) {
  const e = (a.entry && a.entry.type) || a.entry_type || '';
  return e === 'dsh' || String(a.role || '').includes('终端');
}

function openDiscuss() {
  fetch('/api/discuss/state' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''))
    .then(r => r.json()).then(s => {
      if (s.active || (s.history && s.history.length)) { showDiscussRoom(); return; }   // 有讨论（进行中或已结束）→ 恢复视图
      renderDiscussMembers();
      document.getElementById('discussModal').classList.add('show');
    }).catch(() => { renderDiscussMembers(); document.getElementById('discussModal').classList.add('show'); });
}

async function renderDiscussMembers() {
  const box = document.getElementById('discussMemberList');
  let html = '<div style="padding:10px;color:var(--dim);font-size:12px;">加载中…</div>';
  try {
    const resp = await fetch('/api/board' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''));
    const board = await resp.json();
    const all = (board.agents || []).filter(a => a.id !== 'user');
    const term = all.filter(a => isTerminalMember(a));
    const others = all.filter(a => !isTerminalMember(a));
    const row = a => '<div class="discuss-member"><input type="checkbox" data-id="' + esc2(a.id) + '" checked>'
      + '<span>' + esc2(a.name || a.id) + '</span><span class="dm-tag">可参与 · 终端托管</span></div>';
    const rowX = a => '<div class="discuss-member disabled"><input type="checkbox" disabled>'
      + '<span>' + esc2(a.name || a.id) + '</span><span class="dm-tag">不可自动参与 · ' + esc2(((a.entry || {}).type || a.entry_type || '—')) + '</span></div>';
    html = (term.length ? term.map(row).join('') : '<div style="padding:10px;color:var(--dim-1);font-size:12px;">没有终端托管成员——先「＋ 加位子」以终端托管拉入成员。</div>')
      + others.map(rowX).join('');
  } catch (e) { html = '<div style="padding:10px;color:var(--dim);font-size:12px;">成员加载失败</div>'; }
  box.innerHTML = html;
}
function closeDiscussModal() { document.getElementById('discussModal').classList.remove('show'); }

async function startDiscuss() {
  const topic = document.getElementById('discussTopic').value.trim() || '讨论';
  const participants = Array.from(document.querySelectorAll('#discussMemberList input:checked')).map(i => i.dataset.id);
  if (participants.length < 2) { alert('请至少选择 2 个可参与成员'); return; }
  const limit3 = document.getElementById('discussLimit3').checked;
  const btn = document.getElementById('discussStartBtn');
  btn.disabled = true; btn.textContent = '发起中…';
  // start 的响应是持续 SSE 流（讨论期间不结束），不能 await 等它结束；
  // 后台发起即可，事件由 resume/state 流实时推送。
  discussCtrl = new AbortController();
  fetch('/api/discuss/start' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ participants, topic, round_limit: limit3 ? 3 : null }),
    signal: discussCtrl.signal
  }).then(resp => {
    if (!resp.ok) resp.json().catch(() => ({})).then(err => alert('发起失败：' + (err.error || resp.status)));
  }).catch(e => { if (e.name !== 'AbortError') console.error('discuss start:', e); });
  closeDiscussModal();
  showDiscussRoom();
  document.getElementById('drSub').textContent = '发起中…';
  renderDrMembers(participants);
  discussEnded = false;
  resumeDiscuss();
  btn.disabled = false; btn.textContent = '开始讨论';
}

async function showDiscussRoom() {
  document.getElementById('discussRoom').style.display = 'flex';
  const s = await fetch('/api/discuss/state' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : '')).then(r => r.json()).catch(() => ({}));
  document.getElementById('drTitle').textContent = '🗣 讨论室' + (s.topic ? ' · ' + s.topic : '');
  document.getElementById('drSub').textContent = s.active
    ? ('进行中 · 已 ' + (s.round_count || 0) + ' 轮' + (s.round_limit ? ' · ' + s.round_limit + ' 轮后结束' : ''))
    : '已结束';
  document.getElementById('drBanner').textContent = s.active ? '' : (s.round_limit && (s.round_count || 0) >= s.round_limit ? '讨论已结束（达到轮次上限）' : '讨论已结束');
  updateDrLimitBtn(s.round_limit);
  if (s.history) renderDrHistory(s.history);
  if (s.participants) renderDrMembers(s.participants);
  if (s.active && s.busy) setDrSpeaker(s.busy, 'speaking');
  if (!discussCtrl) {           // 已有讨论、重新进入 → resume 重连
    discussEnded = false;
    resumeDiscuss();
  }
}

function hideDiscussRoom() {
  if (discussCtrl) { discussCtrl.abort(); discussCtrl = null; }   // 断开 SSE；讨论在 server 后台继续
  document.getElementById('discussRoom').style.display = 'none';
}

async function resumeDiscuss() {
  discussCtrl = new AbortController();
  try {
    const resp = await fetch('/api/discuss/resume' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}', signal: discussCtrl.signal
    });
    if (!resp.ok) return;
    consumeDiscussStream(resp);
  } catch (e) { /* abort 属正常 */ }
}

async function consumeDiscussStream(resp) {
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n\n');
    buf = lines.pop();
    for (const raw of lines) {
      if (!raw.startsWith('data: ')) continue;
      let ev; try { ev = JSON.parse(raw.slice(6)); } catch (e) { continue; }
      handleDiscussEvent(ev);
    }
  }
  discussCtrl = null;
}

function handleDiscussEvent(ev) {
  const t = ev.type;
  if (t === 'discuss_msg') { drAppend(ev.msg); return; }
  if (t === 'discuss_status') {
    setDrSpeaker(ev.speaker, 'speaking');
    document.getElementById('drSub').textContent = '进行中 · 已 ' + (ev.round || 0) + ' 轮' + (ev.round_limit ? ' · ' + ev.round_limit + ' 轮后结束' : '');
    return;
  }
  if (t === 'discuss_activity') { drActivity(ev.speaker, ev.step); return; }
  if (t === 'discuss_thinking') { drThinking(ev.speaker, ev.text); return; }
  if (t === 'discuss_error') {
    const act = document.getElementById('drActivity'); if (act) act.remove();
    drAppend({ from: '系统', text: '⚠️ ' + (ev.error || '成员异常'), ts: '' });
    if (ev.speaker) setDrSpeaker(ev.speaker, 'waiting');
    return;
  }
  if (t === 'discuss_round_limit') { updateDrLimitBtn(ev.limit); return; }
  if (t === 'discuss_state') {
    document.getElementById('drTitle').textContent = '🗣 讨论室 · ' + (ev.topic || '');
    updateDrLimitBtn(ev.round_limit);
    return;
  }
  if (t === 'discuss_end') {
    discussEnded = true;
    document.getElementById('drBanner').style.display = 'block';
    document.getElementById('drBanner').textContent = '讨论已结束' + (ev.reason === 'round_limit' ? '（达到轮次上限）' : ev.reason === 'user_stop' ? '（你叫停了）' : '');
    document.getElementById('drSub').textContent = '已结束';
    Array.from(document.querySelectorAll('#drMembers .dr-mem')).forEach(el => el.classList.remove('speaking'));
    setTimeout(() => { document.getElementById('drBanner').style.display = 'none'; }, 4000);
  }
}

function renderDrHistory(history) {
  const box = document.getElementById('drMsgs');
  box.innerHTML = '';
  (history || []).forEach(m => drAppend(m, true));
}
function drAppend(m, noScroll) {
  const box = document.getElementById('drMsgs');
  if (!box) return;
  const who = m.from === '你' ? '你' : esc2(m.from || '成员');
  box.insertAdjacentHTML('beforeend', dshMsgHtml(m.from === '你' ? 'user' : 'assistant', m.text || '', who));
  if (!noScroll) box.scrollTop = box.scrollHeight;
}
function drActivity(speaker, step) {
  const act = document.getElementById('drActivity');
  if (act) act.remove();
  const box = document.getElementById('drMsgs');
  if (box) box.insertAdjacentHTML('beforeend', '<div class="dsh-msg thinking" id="drActivity"><span class="who">' + esc2(speaker || '成员') + '</span>⏳ 正在工作中 · 第 ' + (step || 1) + ' 步…</div>');
  box.scrollTop = box.scrollHeight;
}
function drThinking(speaker, text) {
  const box = document.getElementById('drMsgs');
  if (!box || !text) return;
  const n = document.querySelectorAll('.dsh-thinking').length + 1;
  box.insertAdjacentHTML('beforeend', '<details class="dsh-thinking"><summary>🧠 ' + esc2(speaker || '成员') + ' 思考 #' + n + '</summary><div class="th-body">' + esc2(text) + '</div></details>');
  box.scrollTop = box.scrollHeight;
}

function renderDrMembers(participants) {
  const box = document.getElementById('drMembers');
  box.innerHTML = (participants || []).map(id => '<div class="dr-mem" data-id="' + esc2(id) + '"><div class="dm-name">' + esc2(id === 'user' ? '你' : id) + '</div><div class="dm-st">等待发言 ○</div></div>').join('');
}
function setDrSpeaker(agentId, state) {
  const el = document.querySelector('#drMembers .dr-mem[data-id="' + agentId + '"]');
  if (!el) return;
  el.classList.toggle('speaking', state === 'speaking');
  const st = el.querySelector('.dm-st');
  if (st) st.textContent = state === 'speaking' ? '发言中 ●' : state === 'waiting' ? '等待 ○' : '已发言 ✓';
}

async function sendDiscussChat() {
  const input = document.getElementById('drChatInput');
  const text = (input.value || '').trim();
  if (!text) return;
  input.value = '';
  try {
    const resp = await fetch('/api/discuss/chat' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text })
    });
    if (!resp.ok) { const err = await resp.json().catch(() => ({})); alert('插话失败：' + (err.error || resp.status)); return; }
    drAppend({ from: '你', text, ts: '' });
  } catch (e) { alert('插话失败：' + e); }
}
function toggleDiscussLimit() {
  const cur = document.getElementById('drLimitBtn').dataset.limit;
  const next = cur === '3' ? null : 3;
  fetch('/api/discuss/round-limit' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ limit: next })
  }).then(r => r.json()).then(s => updateDrLimitBtn(s.limit)).catch(() => {});
}
function updateDrLimitBtn(limit) {
  const b = document.getElementById('drLimitBtn');
  b.dataset.limit = limit || '';
  b.textContent = limit ? '⏳ ' + limit + ' 轮后自动结束' : '三轮后结束讨论';
  b.classList.toggle('active', !!limit);
}
async function stopDiscuss() {
  await fetch('/api/discuss/stop' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''), { method: 'POST' }).catch(() => {});
}
document.getElementById('drChatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendDiscussChat(); });
