<!DOCTYPE html>
<html lang="zh-CN" data-theme="nothing">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentNexus · 组织视图</title>
<style>
  /* ===== 基础 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0c;
    --bg-2: #141418;
    --panel: #1a1a1f;
    --panel-2: #222228;
    --text: #f2f2f4;
    --dim: #9a9aa2;
    --dim-2: #5c5c66;
    --line: #2a2a32;
    --line-2: #3a3a44;
    --accent: #e5484d;
    --accent-rgb: 229, 72, 77;
    --green: #30a46c;
    --amber: #f5a524;
    --blue: #4c8dff;
    --purple: #9c7bd8;
    --mono: "SF Mono", "JetBrains Mono", Menlo, monospace;
    --sans: -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 8px;
  }
  [data-theme="apple"] {
    --bg: #f5f5f7;
    --bg-2: #ffffff;
    --panel: #ffffff;
    --panel-2: #f2f2f4;
    --text: #1d1d1f;
    --dim: #6e6e73;
    --dim-2: #a1a1a6;
    --line: #e5e5ea;
    --line-2: #d1d1d6;
    --accent: #ff3b30;
    --accent-rgb: 255, 59, 48;
    --green: #34c759;
    --amber: #ff9500;
    --blue: #007aff;
    --purple: #af52de;
  }
  [data-theme="premium"] {
    --bg: #0c0d10;
    --bg-2: #14161c;
    --panel: #191c24;
    --panel-2: #222634;
    --text: #ece5d8;
    --dim: #8d8a80;
    --dim-2: #55534d;
    --line: #2b2e38;
    --line-2: #3a3e4c;
    --accent: #e27d60;
    --accent-rgb: 226, 125, 96;
    --green: #7fae7b;
    --amber: #d8a25e;
    --blue: #7a9cc6;
    --purple: #a28abf;
    --sans: Georgia, "Songti SC", "PingFang SC", serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  /* ===== 顶栏 ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: relative; z-index: 30;
  }
  .topbar-left { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .logo-mark {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    color: var(--accent); letter-spacing: 0.5px;
  }
  .proj-name { font-size: 17px; font-weight: 600; white-space: nowrap; }
  .subtitle {
    font-size: 12px; color: var(--dim); font-family: var(--mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw;
  }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .btn {
    border: 1px solid var(--line-2);
    background: var(--panel);
    color: var(--text);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    cursor: pointer;
    font-family: var(--sans);
    transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--dim-2); background: var(--panel-2); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: rgba(var(--accent-rgb), .12); }
  .btn.ghost { border-color: transparent; color: var(--dim); }
  .btn.ghost:hover { color: var(--text); border-color: var(--line-2); }
  .btn.active { border-color: var(--accent); color: var(--accent); background: rgba(var(--accent-rgb), .08); }

  /* ===== 图例 ===== */
  .legend {
    display: flex; align-items: center; gap: 16px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--line);
    font-size: 11px; color: var(--dim); font-family: var(--mono);
    background: var(--bg);
    position: relative; z-index: 30;
  }
  .legend svg { vertical-align: middle; }
  .legend span { margin-left: 4px; }

  /* ===== 项目切换侧栏 ===== */
  .proj-bar {
    width: 176px; flex-shrink: 0;
    border-right: 1px solid var(--line);
    background: var(--bg-2);
    overflow-y: auto;
    padding: 12px 10px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .proj-bar-head {
    font-size: 11px; font-family: var(--mono); letter-spacing: 1px;
    color: var(--dim-2); margin: 4px 8px 12px;
  }
  .proj-item {
    padding: 8px 10px; border-radius: var(--radius-sm);
    font-size: 13px; color: var(--dim);
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border: 1px solid transparent;
  }
  .proj-item:hover { background: var(--panel); color: var(--text); }
  .proj-item.active { background: var(--panel); color: var(--text); border-color: var(--line-2); font-weight: 600; }
  .proj-item .cnt { float: right; font-family: var(--mono); font-size: 11px; color: var(--dim-2); font-weight: 400; margin-left: 6px; }

  /* ===== 看板浮层（卡片盖在组织视图上） ===== */
  .board-mask {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: none;
  }
  .board-mask.show { display: block; }
  .board-frame { width: 100%; height: 100%; border: 0; display: block; }

  /* ===== 讨论室 v2.20 ===== */
  .discuss-toggle { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text); cursor:pointer; user-select:none; }
  .discuss-toggle input { accent-color:var(--accent); }
  .discuss-member { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; font-size:13px; }
  .discuss-member:hover { background:var(--panel-2); }
  .discuss-member.disabled { opacity:.45; cursor:not-allowed; }
  .discuss-member .dm-tag { font-size:11px; color:var(--dim-1); }
  .discuss-room { position:fixed; inset:0; z-index:120; background:var(--bg); display:flex; flex-direction:column; }
  .dr-top { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel-1); }
  .dr-title { font-size:16px; font-weight:600; }
  .dr-sub { font-size:12px; color:var(--dim-1); }
  .dr-body { flex:1; display:flex; min-height:0; }
  .dr-members { width:200px; border-right:1px solid var(--line); padding:10px; overflow-y:auto; flex-shrink:0; }
  .dr-mem { padding:8px 10px; border-radius:8px; margin-bottom:6px; border:1px solid var(--line); background:var(--panel-1); font-size:13px; }
  .dr-mem .dm-name { font-weight:600; }
  .dr-mem .dm-st { font-size:11px; color:var(--dim-1); margin-top:2px; }
  .dr-mem.speaking { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .dr-chat { flex:1; display:flex; flex-direction:column; min-width:0; }
  .dr-chat .dsh-msgs { flex:1; }
  .dr-input { display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--line); }
  .dr-input input { flex:1; }
  .dr-banner { position:fixed; left:50%; top:14px; transform:translateX(-50%); background:var(--accent); color:var(--bg); padding:8px 18px; border-radius:20px; font-size:13px; font-weight:600; box-shadow:0 4px 20px rgba(0,0,0,.3); z-index:130; }
  .board-close {
    position: fixed; top: 14px; right: 18px; z-index: 101;
    border: 1px solid var(--line-2);
    background: var(--panel);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: var(--sans);
  }
  .board-close:hover { border-color: var(--accent); color: var(--accent); }

  /* ===== 主布局 ===== */
  .main { display: flex; height: calc(100% - 96px); }
  .canvas-wrap {
    flex: 1; position: relative; overflow: auto;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(var(--accent-rgb), 0.05), transparent 70%),
      var(--bg);
  }
  #orgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  #nodeLayer { position: absolute; top: 0; left: 0; }
  #zoomLayer { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .zoom-pct { font-size: 11px; font-family: var(--mono); color: var(--dim); min-width: 44px; text-align: center; user-select: none; }
  .dsh-model-select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-family: var(--mono); font-size: 11px; padding: 2px 4px; max-width: 170px; outline: none; cursor: pointer; }
  .dsh-model-select:focus { border-color: var(--accent); }

  /* ===== 节点卡片（悬浮岛）===== */
  .node {
    position: absolute;
    width: 320px;
    height: 162px;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 14px;
    cursor: grab;
    transition: border-color .15s, box-shadow .15s, transform .15s;
    box-shadow: 0 2px 12px rgba(0,0,0,.25);
    user-select: none;
    overflow: hidden;
  }
  .node.dragging { cursor: grabbing; box-shadow: 0 14px 36px rgba(0,0,0,.35); z-index: 50; }
  .node:hover { border-color: var(--dim-2); transform: translateY(-2px); }
  .node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(var(--accent-rgb), .25); }
  .node.user-node { border-style: dashed; }
  .node-head { display: flex; align-items: center; gap: 10px; }
  .badge {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
    color: #0a0a0c;
    flex-shrink: 0;
  }
  .node-name { font-size: 14px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .node-role { font-size: 11px; color: var(--dim); margin-top: 2px; line-height: 1.35; white-space: normal; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; max-width: 100%; }
  .node-now {
    margin-top: 6px; padding-top: 6px;
    border-top: 1px dashed var(--line-2);
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--dim);
    white-space: nowrap; overflow: hidden;
  }
  .node-now .now-tag {
    flex-shrink: 0; font-family: var(--mono); font-size: 9px; color: var(--dim-2);
    border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; line-height: 1.6;
  }
  .node-now .now-title { overflow: hidden; text-overflow: ellipsis; }
  .exempt-tag {
    position: absolute; top: 8px; right: 8px;
    font-size: 9px; font-family: var(--mono); color: #d9a441;
    border: 1px solid rgba(217,164,65,.35); background: rgba(217,164,65,.08);
    border-radius: 4px; padding: 1px 6px; line-height: 1.6; letter-spacing: .5px;
  }
  .node-status {
    margin-top: 6px; padding-top: 6px;
    border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; font-family: var(--mono); color: var(--dim);
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .st-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  /* 状态色 */
  .c-todo { background: var(--dim-2); }
  .c-doing { background: var(--blue); }
  .c-blocked { background: var(--accent); }
  .c-review { background: var(--amber); }
  .c-done { background: var(--green); }

  /* ===== 右栏读数面板 ===== */
  .side {
    width: 300px; flex-shrink: 0;
    border-left: 1px solid var(--line);
    background: var(--bg-2);
    overflow-y: auto;
    padding: 14px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px;
  }
  .panel-title {
    font-size: 11px; font-family: var(--mono); letter-spacing: 1px;
    color: var(--dim-2); margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .decision-item {
    border-left: 2px solid var(--accent);
    padding: 6px 10px; margin-bottom: 8px;
    background: var(--bg-2);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    font-size: 12px;
  }
  .decision-item .d-title { font-weight: 600; color: var(--text); }
  .decision-item .d-meta { font-size: 11px; color: var(--dim-2); font-family: var(--mono); margin-top: 3px; }
  .decision-item .d-body { color: var(--dim); margin-top: 3px; line-height: 1.5; }
  .big-num { font-size: 28px; font-weight: 700; font-family: var(--mono); color: var(--text); }
  .big-num.warn { color: var(--accent); }
  .big-num.sub { font-size: 14px; color: var(--dim); }
  .readout-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
  .readout-label { font-size: 11px; color: var(--dim); font-family: var(--mono); }
  .readout-val { font-size: 14px; font-weight: 600; font-family: var(--mono); }

  .ev-list { display: flex; flex-direction: column; gap: 8px; }
  .ev-item {
    font-size: 12px; color: var(--dim);
    line-height: 1.45;
    padding: 8px 10px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }
  .ev-item .ev-who { color: var(--text); font-weight: 500; }
  .ev-item .ev-tag {
    display: inline-block; font-size: 10px; font-family: var(--mono);
    padding: 1px 5px; border-radius: 3px; margin-right: 6px;
    border: 1px solid var(--line-2); color: var(--dim-2);
  }
  .ev-item .ev-tag.produce { color: var(--green); border-color: var(--green); }
  .ev-item .ev-tag.report { color: var(--blue); border-color: var(--blue); }
  .ev-item .ev-tag.error { color: var(--accent); border-color: var(--accent); }
  .ev-item .ev-time { font-family: var(--mono); font-size: 10px; color: var(--dim-2); display: block; margin-top: 2px; }

  .pending-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text);
    padding: 7px 9px;
    background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  }
  .pending-item .who { color: var(--dim); font-size: 11px; margin-left: auto; white-space: nowrap; }
  .pending-empty { font-size: 12px; color: var(--dim-2); padding: 6px 2px; font-family: var(--mono); }

  /* ===== 人卡浮层 ===== */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-mask.show { display: flex; }
  .modal-mask.fullscreen { align-items: stretch; justify-content: stretch; padding: 0; }
  .modal-mask.fullscreen .modal { width: 100%; max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; border: none; }
  .modal-mask.fullscreen .chat-box, .modal-mask.fullscreen .chat-box.dsh-box { flex: 1; min-height: 0; }
  .modal {
    width: 560px; max-height: 82vh; overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal-ops { display: flex; gap: 8px; margin: 4px 0 2px; flex-wrap: wrap; }
  #personCard { width: 920px; max-width: 94vw; }
  .person-body { display: flex; align-items: stretch; }
  .person-left { flex: 0 0 340px; max-width: 340px; border-right: 1px solid var(--line); max-height: 58vh; overflow-y: auto; }
  .person-left .modal-sec { padding: 14px 18px; }
  .person-right { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 56vh; max-height: 56vh; overflow: hidden; }
  .person-right .modal-sec { flex: 1; display: flex; flex-direction: column; padding: 14px 20px; border-bottom: none; overflow: hidden; }
  .person-right .chat-list { flex: 1; max-height: none; min-height: 0; overflow-y: auto; }
  .person-right .dsh-msgs { flex: 1; max-height: none; min-height: 0; }
  .person-right .chat-box.dsh-box { flex: 1; min-height: 0; }
  .btn.mini { padding: 4px 10px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; }
  .btn.mini:hover { border-color: var(--accent); }
  .btn.mini.danger { color: var(--accent); border-color: var(--accent); }
  .btn.mini.danger:hover { background: var(--accent); color: #fff; }
  .rename-row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .rename-row input { flex: 1; background: var(--bg-2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  .invite-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0; }
  .mode-chip { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; background: transparent; }
  .mode-chip.active { border-color: var(--accent); background: rgba(var(--accent-rgb), .08); }
  .mode-chip span { font-size: 13px; font-weight: 600; color: var(--text); }
  .mode-chip small { font-size: 11px; color: var(--dim); }
  .invite-target { margin: 4px 0; }
  .invite-body { padding: 4px 2px; }
  .invite-tip { font-size: 12px; color: var(--dim); margin: 4px 0 8px; line-height: 1.5; }
  #inviteText { width: 100%; box-sizing: border-box; min-height: 180px; background: var(--bg-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 12.5px; font-family: var(--mono); line-height: 1.55; resize: vertical; }
  .entry-badge { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--dim); margin-left: 6px; vertical-align: 1px; }
  .entry-badge.guide { border-color: var(--accent); color: var(--accent); }
  .entry-badge.api { border-color: var(--blue); color: var(--blue); }
  .entry-badge.cli { border-color: var(--amber); color: var(--amber); }
  .modal-head {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 20px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--panel); z-index: 2;
  }
  .modal-head .badge { width: 44px; height: 44px; font-size: 18px; }
  .modal-name { font-size: 16px; font-weight: 600; }
  .modal-role { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .modal-close { margin-left: auto; cursor: pointer; color: var(--dim); font-size: 18px; border: none; background: none; }
  .modal-close:hover { color: var(--text); }
  .modal-sec { padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .modal-sec-title { font-size: 11px; font-family: var(--mono); letter-spacing: 1px; color: var(--dim-2); margin-bottom: 10px; }
  .work-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; padding: 6px 0;
  }
  .work-item .t-title { flex: 1; color: var(--text); }
  .work-item .t-id { font-family: var(--mono); font-size: 10px; color: var(--dim-2); }
  .work-empty { font-size: 12px; color: var(--dim-2); font-family: var(--mono); }
  .chat-box {
    display: flex; gap: 8px; margin-top: 10px;
  }
  .chat-box input {
    flex: 1; background: var(--bg-2); border: 1px solid var(--line-2);
    border-radius: var(--radius-sm); padding: 8px 12px;
    color: var(--text); font-size: 13px; font-family: var(--sans);
    outline: none;
  }
  .chat-box input:focus { border-color: var(--accent); }
  .chat-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 220px; overflow-y: auto; }
  .chat-item { font-size: 12px; color: var(--dim); line-height: 1.4; }
  .chat-item .who { color: var(--text); font-weight: 500; }
  .chat-item .time { font-family: var(--mono); font-size: 10px; color: var(--dim-2); margin-left: 6px; }

  .rel-select { display: flex; align-items: center; gap: 8px; }
  .rel-select select {
    background: var(--bg-2); color: var(--text); border: 1px solid var(--line-2);
    border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12px; font-family: var(--sans);
    outline: none;
  }
  .rel-select select:focus { border-color: var(--accent); }

  /* ===== 加位子弹窗 ===== */
  .pos-form { display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; }
  .pos-form input {
    background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--radius-sm);
    padding: 9px 12px; color: var(--text); font-size: 13px; font-family: var(--sans); outline: none;
  }

<script>
/* ===== AgentNexus · 组织视图 v2.9 ===== */
const THEME_ORDER = ['nothing', 'apple', 'premium'];
const THEME_NEXT_LABEL = { nothing: 'A // 亮色', apple: 'P // Premium', premium: 'N // 暗色' };
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('agentnexus_theme', t); } catch (e) {}
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = THEME_NEXT_LABEL[t] || 'A // 亮色';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'nothing';
  applyTheme(THEME_ORDER[(THEME_ORDER.indexOf(cur) + 1) % THEME_ORDER.length]);
}
(function initTheme() {
  let saved = 'nothing';
  try { saved = localStorage.getItem('agentnexus_theme') || 'nothing'; } catch (e) {}
  if (!THEME_ORDER.includes(saved)) saved = 'nothing';
  applyTheme(saved);
})();

/* ===== 状态 ===== */
const params = new URLSearchParams(location.search);
const PROJECT = params.get('project') || '';
let board = null;      // 看板数据
let nodePos = {};      // agent_id -> {x, y, level}
let agentById = {};
let editMode = false;

const STATUS_ORDER = ['blocked', 'in_progress', 'review', 'todo', 'done'];
const STATUS_LABEL = { todo: '待做', in_progress: '进行中', blocked: '卡壳', review: '待验收', done: '完成' };
const AGENT_COLORS = ['#e5484d', '#f5a524', '#30a46c', '#4c8dff', '#9c7bd8', '#f76808', '#12b5c9', '#d95d9e'];
function colorForAgent(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return AGENT_COLORS[h % AGENT_COLORS.length];
}
function badgeText(name) {
  const n = (name || '?').trim();
  return n ? Array.from(n)[0].toUpperCase() : '?';
}
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const p = (x) => String(x).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===== 数据 ===== */
async function loadBoard() {
  const resp = await fetch('/api/board' + (PROJECT ? `?project=${encodeURIComponent(PROJECT)}` : ''));
  if (!resp.ok) throw new Error('board 加载失败 ' + resp.status);
  board = await resp.json();
  agentById = {};
  for (const a of (board.agents || [])) agentById[a.id] = a;
  if (!board.project_info) board.project_info = {};
  document.getElementById('projName').textContent = board.project_info.project_name || PROJECT || '未命名项目';
  const ws = board.project_info.workspace || board.workspace || '';
  document.getElementById('projMeta').textContent =
    (board.project_info.project_desc ? '目标：' + board.project_info.project_desc : '') +
    (ws ? ' · ' + ws : '');
  renderLegend();
  render();
  renderSide();
}

/* ===== 布局：树形分层 ===== */
function buildLevels() {
  const agents = board.agents || [];
  // 默认扁平：无 reports_to 的（user 强制第一）
  const childrenOf = {};
  const roots = [];
  const byId = {};
  for (const a of agents) {
    byId[a.id] = a;
    const rid = (a.reports_to || '').trim() || null;
    if (rid && byId[rid]) {
      (childrenOf[rid] = childrenOf[rid] || []).push(a);
    } else {
      roots.push(a);
    }
  }
  // 排序：user 永远第一
  roots.sort((a, b) => (a.id === 'user' ? -1 : b.id === 'user' ? 1 : 0));
  for (const k of Object.keys(childrenOf)) childrenOf[k].sort((a, b) => (a.id === 'user' ? -1 : b.id === 'user' ? 1 : 0));
  // BFS 分层
  const levels = [];
  const pos = {};
  const queue = roots.map(r => ({ a: r, level: 0 }));
  const visited = new Set();
  while (queue.length) {
    const { a, level } = queue.shift();
    if (visited.has(a.id)) continue;
    visited.add(a.id);
    (levels[level] = levels[level] || []).push(a);
    pos[a.id] = level;
    for (const c of (childrenOf[a.id] || [])) queue.push({ a: c, level: level + 1 });
  }
  // 孤立节点兜底（reports_to 指向不存在的）
  for (const a of agents) {
    if (!visited.has(a.id)) {
      (levels[0] = levels[0] || []).push(a);
      pos[a.id] = 0;
    }
  }
  return { levels, pos };
}

/* ===== 任务推导 ===== */
function tasksOf(agentId) {
  return (board.tasks || []).filter(t => t.assignee === agentId);
}
function agentStatus(agentId) {
  const ts = tasksOf(agentId);
  const active = ts.filter(t => t.status !== 'done');
  if (!active.length) return { key: 'done', label: '手上没活', color: 'var(--green)' };
  let worst = null;
  for (const t of active) {
    const k = t.status || 'todo';
    if (!worst || STATUS_ORDER.indexOf(k) < STATUS_ORDER.indexOf(worst)) worst = k;
  }
  return { key: worst, label: STATUS_LABEL[worst] || worst, color: 'var(--accent)' };
}

/* ===== 画布缩放（v2.15.2） ===== */
let ZOOM = 1, lastTotalW = 1200, lastTotalH = 800;
try { ZOOM = parseFloat(localStorage.getItem('agentnexus_zoom_' + PROJECT)) || 1; } catch (e) {}
function clampZoom(z) { return Math.max(0.15, Math.min(3, z)); }
function applyZoom() {
  const zl = document.getElementById('zoomLayer');
  if (!zl) return;
  ZOOM = clampZoom(ZOOM);
  zl.style.transform = 'scale(' + ZOOM + ')';
  zl.style.width = (lastTotalW * ZOOM) + 'px';
  zl.style.height = (lastTotalH * ZOOM) + 'px';
  const pct = document.getElementById('zoomPct');
  if (pct) pct.textContent = Math.round(ZOOM * 100) + '%';
  try { localStorage.setItem('agentnexus_zoom_' + PROJECT, String(ZOOM)); } catch (e) {}
}
function zoomBy(dir) { ZOOM = clampZoom(ZOOM * (dir > 0 ? 1.2 : 1 / 1.2)); applyZoom(); }
function zoomFit() {
  const wrap = document.getElementById('canvasWrap');
  if (!wrap || !lastTotalW) return;
  const z = Math.min(wrap.clientWidth / lastTotalW, wrap.clientHeight / lastTotalH);
  ZOOM = clampZoom(z > 1.5 ? 1.5 : z);
  applyZoom();
  wrap.scrollLeft = 0; wrap.scrollTop = 0;
}
(function initZoomWheel() {
  const wrap = document.getElementById('canvasWrap');
  if (!wrap) return;
  wrap.addEventListener('wheel', (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const oldZ = ZOOM;
    const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    const nz = clampZoom(oldZ * f);
    if (nz === oldZ) return;
    const cx = (wrap.scrollLeft + mx) / oldZ;
    const cy = (wrap.scrollTop + my) / oldZ;
    ZOOM = nz;
    applyZoom();
    wrap.scrollLeft = cx * ZOOM - mx;
    wrap.scrollTop = cy * ZOOM - my;
  }, { passive: false });
})();

/* ===== 渲染 ===== */
function render() {
  const { levels, pos } = buildLevels();
  const layer = document.getElementById('nodeLayer');
  const svg = document.getElementById('orgCanvas');
  const W = 320, H = 162, PAD_X = 40, GAP_X = 24, LEVEL_GAP = 150, TOP = 70;
  const LAYER_GAP_X = 430, COL_GAP_Y = 30;
  let LAYOUT_DIR = 'lr';
  try { LAYOUT_DIR = localStorage.getItem('agentnexus_layout_' + PROJECT) || 'lr'; } catch (e) {}
  const lr = LAYOUT_DIR === 'lr';
  const lbl = document.getElementById('btn-layout');
  if (lbl) lbl.textContent = lr ? '⇄ 左右' : '⇄ 上下';
  const maxW = Math.max(...levels.map(l => l.length)) || 1;
  let totalW, totalH;
  if (lr) {
    totalW = PAD_X * 2 + (levels.length - 1) * LAYER_GAP_X + W;
    totalH = TOP + maxW * H + (maxW - 1) * COL_GAP_Y + 60;
  } else {
    totalW = PAD_X * 2 + maxW * W + (maxW - 1) * GAP_X;
    totalH = TOP + levels.length * LEVEL_GAP + H + 60;
  }
  layer.style.width = totalW + 'px';
  layer.style.height = totalH + 'px';
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
  lastTotalW = totalW; lastTotalH = totalH;
  applyZoom();
  nodePos = {};
  // 节点定位
  let html = '';
  const order = [];
  window.orderCache = order;
  levels.forEach((list, li) => {
    let baseX, baseY;
    if (lr) {
      baseX = PAD_X + li * LAYER_GAP_X;
      const colH = list.length * H + (list.length - 1) * COL_GAP_Y;
      baseY = Math.max(TOP, (totalH - colH) / 2);
    } else {
      const rowW = PAD_X * 2 + list.length * W + (list.length - 1) * GAP_X;
      baseX = (totalW - rowW) / 2;
      baseY = TOP + li * LEVEL_GAP;
    }
    list.forEach((a, i) => {
      let x = baseX + (lr ? 0 : i * (W + GAP_X));
      let yNode = baseY + (lr ? i * (H + COL_GAP_Y) : 0);
      // v2.12：恢复手动拖拽位置（按 项目+agent 存 localStorage）
      try {
        const saved = JSON.parse(localStorage.getItem('agentnexus_pos_' + PROJECT + '_' + a.id));
        if (saved && typeof saved.x === 'number' && typeof saved.y === 'number') { x = saved.x; yNode = saved.y; }
      } catch (e) {}
      nodePos[a.id] = { x, y: yNode, w: W, h: H, level: li };
      order.push(a);
      const st = agentStatus(a.id);
      const color = a.color || colorForAgent(a.id);
      const _openTs = tasksOf(a.id).filter(t => t.status !== 'done');
      const topTask = _openTs.length ? _openTs.reduce((b, t) => STATUS_ORDER.indexOf(t.status || 'todo') < STATUS_ORDER.indexOf(b.status || 'todo') ? t : b) : null;
      const isUser = a.id === 'user';
      html += `<div class="node ${isUser ? 'user-node' : ''} ${editMode ? '' : ''}" id="node-${esc(a.id)}"
        data-id="${esc(a.id)}" onclick="openPerson('${esc(a.id)}')" style="left:${x}px;top:${yNode}px;">
        <div class="node-head">
          <div class="badge" style="background:${color};">${esc(badgeText(a.name || a.id))}</div>
          <div>
            <div class="node-name">${esc(a.name || a.id)}${isUser ? ' <span style="font-size:10px;color:var(--dim-2);">(我)</span>' : ''}</div>
            <div class="node-role">${esc(a.role || '未设定身份')}</div>
          </div>
        </div>
        <div class="node-status">
          <span><span class="status-dot" style="background:${st.color};"></span>${st.label}</span>
          <span style="color:var(--dim-2);">${tasksOf(a.id).length ? tasksOf(a.id).length + ' 任务' : '·'}</span>
        </div>
        ${topTask ? `<div class="node-now"><span class="now-tag">在途</span><span class="now-title">${esc(topTask.title)}</span></div>` : ''}
        ${(board && board.protocol && board.protocol.mode === 'off' && (board.protocol.exemptions || []).indexOf(a.id) >= 0) ? '<span class="exempt-tag">豁免</span>' : ''}
      </div>`;
    });
  });
  layer.innerHTML = html;
  document.getElementById('emptyState').style.display = order.length ? 'none' : 'block';
  enableNodeDrag();
  renderLines(order);
}

/* ===== 节点拖拽（v2.12） ===== */
function enableNodeDrag() {
  document.querySelectorAll('.node').forEach(el => {
    let sx = 0, sy = 0, ox = 0, oy = 0, dragging = false, moved = false;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      dragging = true; moved = false;
      sx = e.clientX; sy = e.clientY;
      const cs = getComputedStyle(el);
      ox = parseFloat(cs.left) || 0; oy = parseFloat(cs.top) || 0;
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      if (!moved) return;
      el.classList.add('dragging');
      const z = ZOOM || 1;
      el.style.left = (ox + dx / z) + 'px';
      el.style.top = (oy + dy / z) + 'px';
      const id = el.dataset.id;
      const p = nodePos[id];
      if (p) { p.x = ox + dx / z; p.y = oy + dy / z; }
      if (window.orderCache) renderLines(window.orderCache);
    });
    const end = (e) => {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      if (moved) {
        const id = el.dataset.id;
        const p = nodePos[id];
        if (p) {
          try { localStorage.setItem('agentnexus_pos_' + PROJECT + '_' + id, JSON.stringify({ x: p.x, y: p.y })); } catch (err) {}
          el._suppressClick = true;
        }
      }
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('click', (e) => {
      if (el._suppressClick) { e.stopPropagation(); el._suppressClick = false; }
    }, true);
  });
}

/* ===== 连线 ===== */
function renderLines(order) {
  const svg = document.getElementById('orgCanvas');
  const ns = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  const defs = document.createElementNS(ns, 'defs');
  const mkMarker = (id, color, dash) => {
    const m = document.createElementNS(ns, 'marker');
    m.setAttribute('id', id);
    m.setAttribute('viewBox', '0 0 10 10');
    m.setAttribute('refX', dash ? 4 : 8);
    m.setAttribute('refY', '5');
    m.setAttribute('markerWidth', '5');
    m.setAttribute('markerHeight', '5');
    m.setAttribute('orient', 'auto-start-reverse');
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', 'M0,0 L10,5 L0,10 z');
    path.setAttribute('fill', color);
    m.appendChild(path);
    defs.appendChild(m);
  };
  mkMarker('arr-report', 'var(--dim-2)', false);
  mkMarker('arr-collab', 'var(--blue)', true);
  mkMarker('arr-dep', 'var(--amber)', true);
  svg.appendChild(defs);
  const CS = getComputedStyle(document.documentElement);
  const colorVar = (v) => {
    try { return CS.getPropertyValue(v).trim() || v; } catch (e) { return v; }
  };
  const dim2 = colorVar('--dim-2'), blue = colorVar('--blue'), amber = colorVar('--amber');
  const lr = (() => { try { return (localStorage.getItem('agentnexus_layout_' + PROJECT) || 'lr') === 'lr'; } catch (e) { return true; } })();
  // 端口：out = 父侧出线端（下/右），in = 子侧入线端（上/左）
  const port = (id, dir) => {
    const p = nodePos[id]; if (!p) return null;
    // 出线取中点、入线取 0.3h：进出错开，避免父子同高时"线穿堂"的视觉直通
    if (lr) return dir === 'out' ? { x: p.x + p.w, y: p.y + p.h / 2 } : { x: p.x, y: p.y + p.h * 0.3 };
    return dir === 'out' ? { x: p.x + p.w / 2, y: p.y + p.h } : { x: p.x + p.w / 2, y: p.y };
  };
  // 横平竖直的正交线（v2.13.2 纯直角，圆角统一由交汇圆点替代）
  const ortho = (x1, y1, x2, y2) => {
    if (lr) {
      if (Math.abs(y1 - y2) < 1) return `M${x1},${y1} L${x2},${y2}`;
      const mx = (x1 + x2) / 2;
      return `M${x1},${y1} L${mx},${y1} L${mx},${y2} L${x2},${y2}`;
    }
    if (Math.abs(x1 - x2) < 1) return `M${x1},${y1} L${x2},${y2}`;
    const my = (y1 + y2) / 2;
    return `M${x1},${y1} L${x1},${my} L${x2},${my} L${x2},${y2}`;
  };
  const lines = [];
  // 1) 汇报线（实线）：reports_to -> agent，同父共享总线 + 分叉交汇点（v2.13.2）
  const dots = [];
  const groups = {};
  for (const a of (board.agents || [])) {
    const rid = (a.reports_to || '').trim();
    if (rid && nodePos[a.id] && nodePos[rid]) (groups[rid] = groups[rid] || []).push(a.id);
  }
  for (const rid of Object.keys(groups)) {
    const kids = groups[rid].filter(k => nodePos[k]);
    if (!kids.length || !nodePos[rid]) continue;
    const o = port(rid, 'out');
    let bus;
    if (lr) {
      const busX = Math.max(o.x + 20, Math.min(...kids.map(k => nodePos[k].x)) - 40);
      bus = { x: busX, y: o.y };
      for (const k of kids) {
        const ipt = port(k, 'in');
        const iy = ipt ? ipt.y : nodePos[k].y + nodePos[k].h / 2;
        lines.push({ d: `M${o.x},${o.y} L${busX},${o.y} L${busX},${iy} L${nodePos[k].x},${iy}`, color: dim2, dash: '', marker: 'arr-report', cls: 'report', width: 1.6, hub: { x: busX, y: iy } });
      }
    } else {
      const busY = Math.max(o.y + 20, Math.min(...kids.map(k => nodePos[k].y)) - 40);
      bus = { x: o.x, y: busY };
      for (const k of kids) {
        const ipt = port(k, 'in');
        const ix = ipt ? ipt.x : nodePos[k].x + nodePos[k].w / 2;
        lines.push({ d: `M${o.x},${o.y} L${o.x},${busY} L${ix},${busY} L${ix},${nodePos[k].y}`, color: dim2, dash: '', marker: 'arr-report', cls: 'report', width: 1.6, hub: { x: ix, y: busY } });
      }
    }
    if (kids.length >= 2) dots.push(bus);
  }
  // 2) 协作线（虚线）：同一未完成任务的不同 assignee
  const seen = new Set();
  for (const t of (board.tasks || [])) {
    if (!t.assignee || t.status === 'done') continue;
    const related = (board.tasks || []).filter(x => x.id === t.id);
    // 依赖链上的相邻 assignee 也算协作
    const dl = t.depends_on;
    const deps = Array.isArray(dl) ? dl : (typeof dl === 'string' ? dl.split(/[,，]/).map(x => x.trim()).filter(Boolean) : []);
    for (const depId of deps) {
      const dep = (board.tasks || []).find(x => x.id === depId);
      if (dep && dep.assignee && dep.assignee !== t.assignee) {
        const key = [dep.assignee, t.assignee].sort().join('|');
        if (!seen.has(key) && nodePos[dep.assignee] && nodePos[t.assignee]) {
          seen.add(key);
          lines.push({
            d: (() => { const o2 = port(dep.assignee, 'out'), i2 = port(t.assignee, 'in'); return (o2 && i2) ? ortho(o2.x, o2.y, i2.x, i2.y) : ''; })(),
            color: amber, dash: '3 4', marker: 'arr-dep', cls: 'dep', width: 1.2
          });
        }
      }
    }
  }
  // 3) 同任务协作：同一任务多个 assignee？当前任务模型单 assignee，跳过；改为：同一依赖组的协作
  for (const l of lines) {
    const g = document.createElementNS(ns, 'path');
    g.setAttribute('d', l.d);
    g.setAttribute('fill', 'none');
    g.setAttribute('stroke', l.color);
    g.setAttribute('stroke-width', l.width || (l.cls === 'report' ? 1.6 : 1.2));
    if (l.dash) g.setAttribute('stroke-dasharray', l.dash);
    g.setAttribute('marker-end', `url(#${l.marker})`);
    g.setAttribute('opacity', l.cls === 'report' ? 0.8 : 0.55);
    svg.appendChild(g);
    if (l.hub) {
      const c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', l.hub.x); c.setAttribute('cy', l.hub.y);
      c.setAttribute('r', 3.2); c.setAttribute('fill', l.color); c.setAttribute('opacity', 0.9);
      svg.appendChild(c);
    }
  }
  for (const d of dots) {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', d.x); c.setAttribute('cy', d.y);
    c.setAttribute('r', 3.2); c.setAttribute('fill', dim2); c.setAttribute('opacity', 0.9);
    svg.appendChild(c);
  }
}

async function renameAgent(agentId) {
  const a = agentById[agentId];
  if (!a) return;
  const name = prompt('给成员改个名字（id 不变，接入不受影响）：', a.name || agentId);
  if (name === null || !name.trim()) return;
  const resp = await fetch('/api/agents/update' + (PROJECT ? `?project=${encodeURIComponent(PROJECT)}` : ''), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ agent_id: agentId, name: name.trim() })
  });
  const r = await resp.json();

function isTerminalAgent(a) {
  return a && (a.id === 'terminal' || (a.role || '').includes('终端') || a.entry_type === 'dsh' || (a.entry && a.entry.type === 'dsh'));
}
let currentDshAgent = '';  // 当前打开的终端托管成员 id（会话历史按成员隔离）
let dshMsgsCache = [];      // v2.17：聊天历史缓存（打开卡片时从服务端加载，发送/回复时内存追加）
let dshServerUsage = {};   // 服务端累计用量（project_config dsh.members.<id>.usage）
function dshHistory() { return dshMsgsCache; }
function dshTotalTokens() { return dshServerUsage.totalTokens || 0; }
function fmtTokens(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }
async function loadDshHistory() {
  // v2.17：从项目目录持久化文件加载该成员聊天历史（跨浏览器/设备可追溯）
  const box = document.getElementById('dshMsgs');
  const usageEl = document.getElementById('dshUsage');
  if (!box) return;
  try {
    const resp = await fetch('/api/dsh/history' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : '') + '&agent=' + encodeURIComponent(currentDshAgent || 'terminal'));
    const j = await resp.json();
    if (!j.ok) throw new Error(j.error || '加载失败');
    dshServerUsage = j.total_usage || {};
    dshMsgsCache = j.history || [];
    const h = dshMsgsCache.slice(-30);
    box.innerHTML = h.length ? h.map(m => {
      const cls = m.role === 'user' ? 'user' : (m.role === 'thinking' ? 'thinking' : 'assistant');
      const who = m.role === 'user' ? '你' : '终端 Agent';
      return `<div class="dsh-msg ${cls}"><span class="who">${who}</span>${esc2(m.content || '')}</div>`;
    }).join('') : '<div class="work-empty" style="padding:10px 0;">还没有对话 —— 直接在下方输入指令，终端 Agent 会实时回复并操作看板。</div>';
    if (usageEl) usageEl.textContent = '用量：' + fmtTokens(dshTotalTokens());
  } catch (e) {
    box.innerHTML = '<div class="work-empty" style="padding:10px 0;">历史加载失败：' + esc2(e.message) + '</div>';
  }
}
function togglePersonFullscreen() {
  const m = document.getElementById('personModal');
  if (m) m.classList.toggle('fullscreen');
}
function esc2(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function renderDshHistory() {
  // v2.17：打开卡片时由 loadDshHistory() 从服务端加载；此函数仅用于同步兜底
  const h = dshHistory().slice(-30);
  if (!h.length) return '<div class="work-empty" style="padding:10px 0;">还没有对话 —— 直接在下方输入指令，终端 Agent 会实时回复并操作看板。</div>';
  return h.map(m => {
    const cls = m.role === 'user' ? 'user' : (m.role === 'thinking' ? 'thinking' : 'assistant');
    const who = m.role === 'user' ? '你' : '终端 Agent';
    return `<div class="dsh-msg ${cls}"><span class="who">${who}</span>${esc2(m.content || '')}</div>`;
  }).join('');
}
async function clearDshHistory() {
  if (!confirm('确定清空该成员的会话？历史记录与 Agent 记忆都会归零。')) return;
  try {
    const resp = await fetch('/api/dsh/history/clear' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : '') + '&agent=' + encodeURIComponent(currentDshAgent || 'terminal'), { method: 'POST' });
    const j = await resp.json();
    if (!j.ok) throw new Error(j.error || '清空失败');
    dshMsgsCache = [];
    dshServerUsage = {};
    document.getElementById('dshMsgs').innerHTML = '<div class="work-empty" style="padding:10px 0;">会话已清空 —— 下一轮消息将从新上下文开始。</div>';
    document.getElementById('dshUsage').textContent = '用量：0';
  } catch (e) { alert('清空失败：' + e.message); }
}
function dshAppend(role, content) {
  const box = document.getElementById('dshMsgs');
  if (!box) return;
  const cls = role === 'user' ? 'user' : (role === 'thinking' ? 'thinking' : 'assistant');
  const who = role === 'user' ? '你' : '终端 Agent';
  box.insertAdjacentHTML('beforeend', `<div class="dsh-msg ${cls}"><span class="who">${who}</span>${esc2(content)}</div>`);
  box.scrollTop = box.scrollHeight;

// v2.19.3：思考过程折叠块（默认收起，点开看完整推导）
function appendThinking(text) {

  box.insertAdjacentHTML('beforeend',

}

async function sendToTerminal() {
  const input = document.getElementById('dshInput');
  const btn = document.getElementById('dshSendBtn');
  const text = (input.value || '').trim();
  if (!text) return;
  input.value = '';
  dshAppend('user', text);
  dshMsgsCache.push({ role: 'user', content: text });  // v2.17：用户消息进缓存（服务端已同步落盘）
  btn.disabled = true; btn.textContent = '回复中…';
  const h = dshHistory();
  const histCtx = h.slice(-4).map(m => (m.role === 'user' ? '你' : '终端 Agent') + '：' + (m.content || '')).join('\n');
  const payload = { message: text, context: histCtx || '', session_id: '' };  // v2.17：纯消息落盘，上下文独立传
  try {
    const resp = await fetch('/api/dsh/chat' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : '') + '&agent=' + encodeURIComponent(currentDshAgent || 'terminal'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      dshAppend('assistant', '⚠️ ' + (err.error || ('HTTP ' + resp.status)));
      return;
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let gotReply = false;
    let replyContent = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const raw of lines) {
        if (!raw.startsWith('data: ')) continue;
        let ev; try { ev = JSON.parse(raw.slice(6)); } catch (e) { continue; }
        const t = ev.type;
        if (t === 'session') continue;
        if (t === 'status') {  // v2.19.3：步骤进展可见——「正在工作中 · 第 N 步」
          const ph = ev.phase || '';
          const act = document.getElementById('dshActivity');
          if (ph === 'step_start') {
            if (act) act.innerHTML = '<span class="who">终端 Agent</span>⏳ 正在工作中 · 第 ' + (ev.step || 1) + ' 步…';
            else {
              const box = document.getElementById('dshMsgs');
              if (box) box.insertAdjacentHTML('beforeend', '<div class="dsh-msg thinking" id="dshActivity"><span class="who">终端 Agent</span>⏳ 正在工作中 · 第 ' + (ev.step || 1) + ' 步…</div>');
            }
          } else if (ph === 'turn_end' && act) {
            act.remove();
          }
          continue;
        }
        if (t === 'thinking') {  // v2.19.3：思考过程折叠可见（可展开）
          appendThinking(ev.text);
          continue;
        }
        if (t === 'approval') {
          renderApproval(ev);
          continue;
        }
        if (t === 'dsh_error') {  // v2.19.3：模型/上游错误可见，不再静默卡住
          const act = document.getElementById('dshActivity'); if (act) act.remove();
          dshAppend('assistant', '⚠️ ' + (ev.error || '会话异常'));
          gotReply = true;
          continue;
        }
        if (t === 'text') {
          const act = document.getElementById('dshActivity'); if (act) act.remove();
          replyContent = ev.text || '';
          if (!gotReply) { dshAppend('assistant', replyContent); gotReply = true; }
          else {
            const box = document.getElementById('dshMsgs');
            const last = box ? box.lastElementChild : null;
            if (last && last.classList.contains('dsh-msg')) last.innerHTML = '<span class="who">终端 Agent</span>' + esc2(replyContent);
          }
          continue;
        }
        if (t === 'final') {
          if (ev.text && ev.text !== replyContent) {
            replyContent = ev.text;
            const box = document.getElementById('dshMsgs');
            const last = box ? box.lastElementChild : null;
            if (last && last.classList.contains('dsh-msg')) last.innerHTML = '<span class="who">终端 Agent</span>' + esc2(replyContent);
          }
          continue;
        }
        if (t === 'dsh_done') {
          const act = document.getElementById('dshActivity'); if (act) act.remove();  // v2.19.3 兜底
          if (!ev.ok && replyContent === '' && !gotReply) dshAppend('assistant', '⚠️ 会话未完成（超时或进程中断），没有产出回复。');  // v2.19.3 不再静默
          const usage = ev.usage || {};
          const total = ev.total_usage || {};
          dshMsgsCache.push({ role: 'assistant', content: replyContent, usage: { inputTokens: usage.inputTokens || 0, outputTokens: usage.outputTokens || 0, totalTokens: usage.totalTokens || 0 } });
          dshServerUsage = total;  // v2.17：用量以服务端为准
          const box = document.getElementById('dshMsgs');
          if (box && box.lastElementChild) {
            box.lastElementChild.insertAdjacentHTML('beforeend', `<div class="dsh-usage">⟐ in ${fmtTokens(usage.inputTokens || 0)} / out ${fmtTokens(usage.outputTokens || 0)} / 累计 ${fmtTokens(total.totalTokens || 0)}</div>`);
          }
          document.getElementById('dshUsage').textContent = '用量：' + fmtTokens((total.inputTokens||0) + (total.outputTokens||0));
        }
      }
    }
  } catch (e) {
    dshAppend('assistant', '⚠️ 连接中断：' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = '发送';
  }
}

function renderApproval(ev) {
  const list = document.getElementById('dshApprovalList');

    '<div class="apv-reason">' + esc(reason || '执行此操作需要权限升级') + '</div>' +
    '<div class="apv-actions">' +
      '<button class="btn mini" onclick="approveDshRequest(\'' + rid + '\',\'allow\',this)">批准</button>' +
      '<button class="btn mini danger" onclick="approveDshRequest(\'' + rid + '\',\'reject\',this)">拒绝</button>' +

async function approveDshRequest(requestId, option, btn) {
  if (!btn) return;
  btn.disabled = true;
  const card = btn.closest('.dsh-approval');
  try {
    const resp = await fetch('/api/dsh/approve' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requestId, option })
    });
    const r = await resp.json().catch(() => ({}));
    if (!r.ok) {
      const tip = btn.parentElement.querySelector('.apv-tip');
      if (tip) tip.textContent = '⚠️ 应答失败：' + (r.error || 'HTTP ' + resp.status);
      btn.disabled = false;
      return;
    }
    if (card) {
      card.classList.add(option === 'allow' ? 'apv-done-allow' : 'apv-done-reject');
      const acts = card.querySelector('.apv-actions');
      if (acts) acts.innerHTML = '<span class="apv-done">' + (option === 'allow' ? '✓ 已批准，继续执行' : '✕ 已拒绝') + '</span>';
      const tip = card.querySelector('.apv-tip');
      if (tip) tip.remove();
      const head = card.querySelector('.apv-head');
      if (head) head.textContent = (option === 'allow' ? '✓ 已批准' : '✕ 已拒绝') + ' · ' + esc((card.querySelector('.apv-tool')||{}).textContent || '');
    }
  } catch (e) {
    const tip = btn.parentElement.querySelector('.apv-tip');
    if (tip) tip.textContent = '⚠️ 应答失败：' + e.message;
    btn.disabled = false;
  }
}

      const cnt = p.task_count ? p.task_count : '';
      return `<div class="proj-item${active ? ' active' : ''}" title="${esc(name)}"
        onclick="location.href='org_chart.html?project=${encodeURIComponent(name)}'">${esc(name)}${cnt ? `<span class="cnt">${cnt}</span>` : ''}</div>`;
    }).join('') || '<div style="color:var(--dim-2);font-size:12px;padding:8px;">暂无项目</div>';
  } catch (e) {
    console.error('项目列表加载失败', e);
  }
}

/* ===== 看板浮层 ===== */
/* ===== 讨论室 v2.20 ===== */
let discussCtrl = null;        // AbortController（隐藏视图时断开 SSE，讨论在后台继续）
let discussEnded = false;

function isTerminalMember(a) {
  const e = (a.entry && a.entry.type) || a.entry_type || '';
  return e === 'dsh' || String(a.role || '').includes('终端');
}

function openDiscuss() {
  fetch('/api/discuss/state' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''))
    .then(r => r.json()).then(s => {
      if (s.active || (s.history && s.history.length)) { showDiscussRoom(); return; }   // 有讨论（进行中或已结束）→ 恢复视图
      renderDiscussMembers();
      document.getElementById('discussModal').classList.add('show');
    }).catch(() => { renderDiscussMembers(); document.getElementById('discussModal').classList.add('show'); });
}

async function renderDiscussMembers() {
  const box = document.getElementById('discussMemberList');
  let html = '<div style="padding:10px;color:var(--dim);font-size:12px;">加载中…</div>';
  try {
    const resp = await fetch('/api/board' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''));
    const board = await resp.json();
    const all = (board.agents || []).filter(a => a.id !== 'user');
    const term = all.filter(a => isTerminalMember(a));
    const others = all.filter(a => !isTerminalMember(a));
    const row = a => '<div class="discuss-member"><input type="checkbox" data-id="' + esc2(a.id) + '" checked>'
      + '<span>' + esc2(a.name || a.id) + '</span><span class="dm-tag">可参与 · 终端托管</span></div>';
    const rowX = a => '<div class="discuss-member disabled"><input type="checkbox" disabled>'
      + '<span>' + esc2(a.name || a.id) + '</span><span class="dm-tag">不可自动参与 · ' + esc2(((a.entry || {}).type || a.entry_type || '—')) + '</span></div>';
    html = (term.length ? term.map(row).join('') : '<div style="padding:10px;color:var(--dim-1);font-size:12px;">没有终端托管成员——先「＋ 加位子」以终端托管拉入成员。</div>')
      + others.map(rowX).join('');
  } catch (e) { html = '<div style="padding:10px;color:var(--dim);font-size:12px;">成员加载失败</div>'; }
  box.innerHTML = html;
}
function closeDiscussModal() { document.getElementById('discussModal').classList.remove('show'); }

async function startDiscuss() {
  const topic = document.getElementById('discussTopic').value.trim() || '讨论';
  const participants = Array.from(document.querySelectorAll('#discussMemberList input:checked')).map(i => i.dataset.id);
  if (participants.length < 2) { alert('请至少选择 2 个可参与成员'); return; }
  const limit3 = document.getElementById('discussLimit3').checked;
  const btn = document.getElementById('discussStartBtn');
  btn.disabled = true; btn.textContent = '发起中…';
  // start 的响应是持续 SSE 流（讨论期间不结束），不能 await 等它结束；
  // 后台发起即可，事件由 resume/state 流实时推送。
  discussCtrl = new AbortController();
  fetch('/api/discuss/start' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ participants, topic, round_limit: limit3 ? 3 : null }),
    signal: discussCtrl.signal
  }).then(resp => {
    if (!resp.ok) resp.json().catch(() => ({})).then(err => alert('发起失败：' + (err.error || resp.status)));
  }).catch(e => { if (e.name !== 'AbortError') console.error('discuss start:', e); });
  closeDiscussModal();
  showDiscussRoom();
  document.getElementById('drSub').textContent = '发起中…';
  renderDrMembers(participants);
  discussEnded = false;
  resumeDiscuss();
  btn.disabled = false; btn.textContent = '开始讨论';
}

async function showDiscussRoom() {
  document.getElementById('discussRoom').style.display = 'flex';
  const s = await fetch('/api/discuss/state' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : '')).then(r => r.json()).catch(() => ({}));
  document.getElementById('drTitle').textContent = '🗣 讨论室' + (s.topic ? ' · ' + s.topic : '');
  document.getElementById('drSub').textContent = s.active
    ? ('进行中 · 已 ' + (s.round_count || 0) + ' 轮' + (s.round_limit ? ' · ' + s.round_limit + ' 轮后结束' : ''))
    : '已结束';
  document.getElementById('drBanner').textContent = s.active ? '' : (s.round_limit && (s.round_count || 0) >= s.round_limit ? '讨论已结束（达到轮次上限）' : '讨论已结束');
  updateDrLimitBtn(s.round_limit);
  if (s.history) renderDrHistory(s.history);
  if (s.participants) renderDrMembers(s.participants);
  if (s.active && s.busy) setDrSpeaker(s.busy, 'speaking');
  if (!discussCtrl) {           // 已有讨论、重新进入 → resume 重连
    discussEnded = false;
    resumeDiscuss();
  }
}

function hideDiscussRoom() {
  if (discussCtrl) { discussCtrl.abort(); discussCtrl = null; }   // 断开 SSE；讨论在 server 后台继续
  document.getElementById('discussRoom').style.display = 'none';
}

async function resumeDiscuss() {
  discussCtrl = new AbortController();
  try {
    const resp = await fetch('/api/discuss/resume' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}', signal: discussCtrl.signal
    });
    if (!resp.ok) return;
    consumeDiscussStream(resp);
  } catch (e) { /* abort 属正常 */ }
}

async function consumeDiscussStream(resp) {
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n\n');
    buf = lines.pop();
    for (const raw of lines) {
      if (!raw.startsWith('data: ')) continue;
      let ev; try { ev = JSON.parse(raw.slice(6)); } catch (e) { continue; }
      handleDiscussEvent(ev);
    }
  }
  discussCtrl = null;
}

function handleDiscussEvent(ev) {
  const t = ev.type;
  if (t === 'discuss_msg') { drAppend(ev.msg); return; }
  if (t === 'discuss_status') {
    setDrSpeaker(ev.speaker, 'speaking');
    document.getElementById('drSub').textContent = '进行中 · 已 ' + (ev.round || 0) + ' 轮' + (ev.round_limit ? ' · ' + ev.round_limit + ' 轮后结束' : '');
    return;
  }
  if (t === 'discuss_activity') { drActivity(ev.speaker, ev.step); return; }
  if (t === 'discuss_thinking') { drThinking(ev.speaker, ev.text); return; }
  if (t === 'discuss_error') {
    const act = document.getElementById('drActivity'); if (act) act.remove();
    drAppend({ from: '系统', text: '⚠️ ' + (ev.error || '成员异常'), ts: '' });
    if (ev.speaker) setDrSpeaker(ev.speaker, 'waiting');
    return;
  }
  if (t === 'discuss_round_limit') { updateDrLimitBtn(ev.limit); return; }
  if (t === 'discuss_state') {
    document.getElementById('drTitle').textContent = '🗣 讨论室 · ' + (ev.topic || '');
    updateDrLimitBtn(ev.round_limit);
    return;
  }
  if (t === 'discuss_end') {
    discussEnded = true;
    document.getElementById('drBanner').style.display = 'block';
    document.getElementById('drBanner').textContent = '讨论已结束' + (ev.reason === 'round_limit' ? '（达到轮次上限）' : ev.reason === 'user_stop' ? '（你叫停了）' : '');
    document.getElementById('drSub').textContent = '已结束';
    Array.from(document.querySelectorAll('#drMembers .dr-mem')).forEach(el => el.classList.remove('speaking'));
    setTimeout(() => { document.getElementById('drBanner').style.display = 'none'; }, 4000);
  }
}

function renderDrHistory(history) {
  const box = document.getElementById('drMsgs');
  box.innerHTML = '';
  (history || []).forEach(m => drAppend(m, true));
}
function drAppend(m, noScroll) {
  const box = document.getElementById('drMsgs');
  if (!box) return;
  const who = m.from === '你' ? '你' : esc2(m.from || '成员');
  box.insertAdjacentHTML('beforeend', '<div class="dsh-msg ' + (m.from === '你' ? 'user' : 'assistant') + '"><span class="who">' + who + '</span>' + esc2(m.text || '') + '</div>');
  if (!noScroll) box.scrollTop = box.scrollHeight;
}
function drActivity(speaker, step) {
  const act = document.getElementById('drActivity');
  if (act) act.remove();
  const box = document.getElementById('drMsgs');
  if (box) box.insertAdjacentHTML('beforeend', '<div class="dsh-msg thinking" id="drActivity"><span class="who">' + esc2(speaker || '成员') + '</span>⏳ 正在工作中 · 第 ' + (step || 1) + ' 步…</div>');
  box.scrollTop = box.scrollHeight;
}
function drThinking(speaker, text) {
  const box = document.getElementById('drMsgs');
  if (!box || !text) return;
  const n = document.querySelectorAll('.dsh-thinking').length + 1;
  box.insertAdjacentHTML('beforeend', '<details class="dsh-thinking"><summary>🧠 ' + esc2(speaker || '成员') + ' 思考 #' + n + '</summary><div class="th-body">' + esc2(text) + '</div></details>');
  box.scrollTop = box.scrollHeight;
}

function renderDrMembers(participants) {
  const box = document.getElementById('drMembers');
  box.innerHTML = (participants || []).map(id => '<div class="dr-mem" data-id="' + esc2(id) + '"><div class="dm-name">' + esc2(id === 'user' ? '你' : id) + '</div><div class="dm-st">等待发言 ○</div></div>').join('');
}
function setDrSpeaker(agentId, state) {
  const el = document.querySelector('#drMembers .dr-mem[data-id="' + agentId + '"]');
  if (!el) return;
  el.classList.toggle('speaking', state === 'speaking');
  const st = el.querySelector('.dm-st');
  if (st) st.textContent = state === 'speaking' ? '发言中 ●' : state === 'waiting' ? '等待 ○' : '已发言 ✓';
}

async function sendDiscussChat() {
  const input = document.getElementById('drChatInput');
  const text = (input.value || '').trim();
  if (!text) return;
  input.value = '';
  try {
    const resp = await fetch('/api/discuss/chat' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text })
    });
    if (!resp.ok) { const err = await resp.json().catch(() => ({})); alert('插话失败：' + (err.error || resp.status)); return; }
    drAppend({ from: '你', text, ts: '' });
  } catch (e) { alert('插话失败：' + e); }
}
function toggleDiscussLimit() {
  const cur = document.getElementById('drLimitBtn').dataset.limit;
  const next = cur === '3' ? null : 3;
  fetch('/api/discuss/round-limit' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''), {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ limit: next })
  }).then(r => r.json()).then(s => updateDrLimitBtn(s.limit)).catch(() => {});
}
function updateDrLimitBtn(limit) {
  const b = document.getElementById('drLimitBtn');
  b.dataset.limit = limit || '';
  b.textContent = limit ? '⏳ ' + limit + ' 轮后自动结束' : '三轮后结束讨论';
  b.classList.toggle('active', !!limit);
}
async function stopDiscuss() {
  await fetch('/api/discuss/stop' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : ''), { method: 'POST' }).catch(() => {});
}
document.getElementById('drChatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendDiscussChat(); });

function openBoardModal() {
  const src = 'collab_board_nothing.html' + (PROJECT ? `?project=${encodeURIComponent(PROJECT)}` : '') + '&embed=1';
  document.getElementById('boardFrame').src = src;
  document.getElementById('boardModal').classList.add('show');
}
function closeBoardModal() {
  document.getElementById('boardModal').classList.remove('show');
  document.getElementById('boardFrame').src = 'about:blank';
}

document.getElementById('btn-board').onclick = openBoardModal;
document.getElementById('boardClose').onclick = closeBoardModal;

  } catch (e) {
    console.error('组织视图加载失败:', e);
    document.getElementById('emptyState').style.display = 'block';

      '<br><button class="btn" style="margin-top:12px;" onclick="location.reload()">重试</button>';
  }
})();
