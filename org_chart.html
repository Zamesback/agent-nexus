<!DOCTYPE html>
<html lang="zh-CN" data-theme="nothing">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentNexus · 组织视图</title>
<style>
  /* ===== 基础 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0c;
    --bg-2: #141418;
    --panel: #1a1a1f;
    --panel-2: #222228;
    --text: #f2f2f4;
    --dim: #9a9aa2;
    --dim-2: #5c5c66;
    --line: #2a2a32;
    --line-2: #3a3a44;
    --accent: #e5484d;
    --accent-rgb: 229, 72, 77;
    --green: #30a46c;
    --amber: #f5a524;
    --blue: #4c8dff;
    --purple: #9c7bd8;
    --mono: "SF Mono", "JetBrains Mono", Menlo, monospace;
    --sans: -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 8px;
  }
  [data-theme="apple"] {
    --bg: #f5f5f7;
    --bg-2: #ffffff;
    --panel: #ffffff;
    --panel-2: #f2f2f4;
    --text: #1d1d1f;
    --dim: #6e6e73;
    --dim-2: #a1a1a6;
    --line: #e5e5ea;
    --line-2: #d1d1d6;
    --accent: #ff3b30;
    --accent-rgb: 255, 59, 48;
    --green: #34c759;
    --amber: #ff9500;
    --blue: #007aff;
    --purple: #af52de;
  }
  [data-theme="premium"] {
    --bg: #0c0d10;
    --bg-2: #14161c;
    --panel: #191c24;
    --panel-2: #222634;
    --text: #ece5d8;
    --dim: #8d8a80;
    --dim-2: #55534d;
    --line: #2b2e38;
    --line-2: #3a3e4c;
    --accent: #e27d60;
    --accent-rgb: 226, 125, 96;
    --green: #7fae7b;
    --amber: #d8a25e;
    --blue: #7a9cc6;
    --purple: #a28abf;
    --sans: Georgia, "Songti SC", "PingFang SC", serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  /* ===== 顶栏 ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: relative; z-index: 30;
  }
  .topbar-left { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .logo-mark {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    color: var(--accent); letter-spacing: 0.5px;
  }
  .proj-name { font-size: 17px; font-weight: 600; white-space: nowrap; }
  .subtitle {
    font-size: 12px; color: var(--dim); font-family: var(--mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw;
  }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .btn {
    border: 1px solid var(--line-2);
    background: var(--panel);
    color: var(--text);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    cursor: pointer;
    font-family: var(--sans);
    transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--dim-2); background: var(--panel-2); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: rgba(var(--accent-rgb), .12); }
  .btn.ghost { border-color: transparent; color: var(--dim); }
  .btn.ghost:hover { color: var(--text); border-color: var(--line-2); }
  .btn.active { border-color: var(--accent); color: var(--accent); background: rgba(var(--accent-rgb), .08); }

  /* ===== 图例 ===== */
  .legend {
    display: flex; align-items: center; gap: 16px;
    padding: 8px 20px;
    border-bottom: 1px solid var(--line);
    font-size: 11px; color: var(--dim); font-family: var(--mono);
    background: var(--bg);
    position: relative; z-index: 30;
  }
  .legend svg { vertical-align: middle; }
  .legend span { margin-left: 4px; }

  /* ===== 项目切换侧栏 ===== */
  .proj-bar {
    width: 176px; flex-shrink: 0;
    background: var(--bg-2);
    overflow-y: auto;
    padding: 12px 10px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .proj-bar-head {
    font-size: 11px; font-family: var(--mono); letter-spacing: 1px;
    color: var(--dim-2); margin: 4px 8px 12px;
  }
  .proj-item {
    padding: 8px 10px; border-radius: var(--radius-sm);
    font-size: 13px; color: var(--dim);
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    border: 1px solid transparent;
  }
  .proj-item:hover { background: var(--panel); color: var(--text); }
  .proj-item.active { background: var(--panel); color: var(--text); border-color: var(--line-2); font-weight: 600; }
  .proj-item .cnt { float: right; font-family: var(--mono); font-size: 11px; color: var(--dim-2); font-weight: 400; margin-left: 6px; }

  /* ===== 讨论室 v2.20 ===== */
  .discuss-toggle { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text); cursor:pointer; user-select:none; }
  .discuss-toggle input { accent-color:var(--accent); }
  .discuss-member { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; font-size:13px; }
  .discuss-member:hover { background:var(--panel-2); }
  .discuss-member.disabled { opacity:.45; cursor:not-allowed; }
  .discuss-member .dm-tag { font-size:11px; color:var(--dim-1); }
  .discuss-room { position:fixed; inset:0; z-index:120; background:var(--bg); display:flex; flex-direction:column; }
  .dr-top { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel-1); }
  .dr-title { font-size:16px; font-weight:600; }
  .dr-sub { font-size:12px; color:var(--dim-1); }
  .dr-body { flex:1; display:flex; min-height:0; }
  .dr-members { width:200px; border-right:1px solid var(--line); padding:10px; overflow-y:auto; flex-shrink:0; }
  .dr-mem { padding:8px 10px; border-radius:8px; margin-bottom:6px; border:1px solid var(--line); background:var(--panel-1); font-size:13px; }
  .dr-mem .dm-name { font-weight:600; }
  .dr-mem .dm-st { font-size:11px; color:var(--dim-1); margin-top:2px; }
  .dr-mem.speaking { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .dr-chat { flex:1; display:flex; flex-direction:column; min-width:0; }
  .dr-chat .dsh-msgs { flex:1; }
  .dr-input { display:flex; gap:8px; padding:10px 16px; border-top:1px solid var(--line); }
  .dr-input input { flex:1; }
  .dr-banner { position:fixed; left:50%; top:14px; transform:translateX(-50%); background:var(--accent); color:var(--bg); padding:8px 18px; border-radius:20px; font-size:13px; font-weight:600; box-shadow:0 4px 20px rgba(0,0,0,.3); z-index:130; }
  /* ===== 主布局 ===== */
  .main { display: flex; height: calc(100% - 96px); position: relative; }
  /* ===== 左栏收起 + 画布拖拽平移（v2.20.17）===== */
  .proj-bar-head { display: flex; align-items: center; justify-content: space-between; }
  .proj-collapse {
    font: inherit; font-size: 12px; line-height: 1; color: var(--dim-2);
    background: none; border: 0; padding: 3px 6px; border-radius: 6px;
    cursor: pointer; transition: color .15s, background .15s;
  }
  .proj-collapse:hover { color: var(--accent); background: var(--panel); }
  body.proj-collapsed .proj-bar, body.proj-collapsed #splitLeft { display: none; }
  .proj-reveal {
    display: none; position: absolute; left: 8px; top: 10px; z-index: 8;
    font: inherit; font-size: 12px; line-height: 1; color: var(--dim);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 9px; cursor: pointer; transition: color .15s, border-color .15s;
  }
  .proj-reveal:hover { color: var(--accent); border-color: var(--accent); }
  body.proj-collapsed .proj-reveal { display: inline-flex; }
  .canvas-wrap.panning { cursor: grabbing; }
  .canvas-wrap.panning * { cursor: grabbing !important; }
  body.canvas-panning, body.canvas-panning * { user-select: none !important; }
  /* ===== 可拖动分隔条（v2.20.6）===== */
  .splitter {
    flex: 0 0 6px; position: relative; cursor: col-resize;
    background: transparent; z-index: 6; touch-action: none;
  }
  .splitter::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 2px;
    background: var(--line); transition: background .12s;
  }
  .splitter:hover::after, .splitter.dragging::after { background: var(--accent); }
  body.col-resizing, body.col-resizing * { cursor: col-resize !important; user-select: none !important; }
  .splitter-h {
    flex: 0 0 6px; position: relative; cursor: row-resize;
    background: transparent; z-index: 6; touch-action: none; margin: 2px 0;
  }
  .splitter-h::after {
    content: ''; position: absolute; left: 0; right: 0; top: 2px; height: 2px;
    background: var(--line); transition: background .12s;
  }
  .splitter-h:hover::after, .splitter-h.dragging::after { background: var(--accent); }
  body.row-resizing, body.row-resizing * { cursor: row-resize !important; user-select: none !important; }
  .canvas-wrap {
    flex: 1; position: relative; overflow: auto;
    cursor: grab;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(var(--accent-rgb), 0.05), transparent 70%),
      var(--bg);
  }
  #orgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  #nodeLayer { position: absolute; top: 0; left: 0; }
  #zoomLayer { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .zoom-pct { font-size: 11px; font-family: var(--mono); color: var(--dim); min-width: 44px; text-align: center; user-select: none; }
  .dsh-model-select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; color: var(--text); font-family: var(--mono); font-size: 11px; padding: 2px 4px; max-width: 170px; outline: none; cursor: pointer; }
  .dsh-model-select:focus { border-color: var(--accent); }

  /* ===== 节点卡片（悬浮岛）===== */
  .node {
    position: absolute;
    width: 320px;
    height: 162px;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 14px;
    cursor: grab;
    transition: border-color .15s, box-shadow .15s, transform .15s;
    box-shadow: 0 2px 12px rgba(0,0,0,.25);
    user-select: none;
    overflow: hidden;
  }
  .node.dragging { cursor: grabbing; box-shadow: 0 14px 36px rgba(0,0,0,.35); z-index: 50; }
  .node:hover { border-color: var(--dim-2); transform: translateY(-2px); }
  .node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(var(--accent-rgb), .25); }
  .node.user-node { border-style: dashed; }
  .node-head { display: flex; align-items: center; gap: 10px; }
  .badge {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px;
    color: #0a0a0c;
    flex-shrink: 0;
  }
  .node-name { font-size: 14px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .node-role { font-size: 11px; color: var(--dim); margin-top: 2px; line-height: 1.35; white-space: normal; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; max-width: 100%; }
  .node-now {
    margin-top: 6px; padding-top: 6px;
    border-top: 1px dashed var(--line-2);
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--dim);
    white-space: nowrap; overflow: hidden;
  }
  .node-now .now-tag {
    flex-shrink: 0; font-family: var(--mono); font-size: 9px; color: var(--dim-2);
    border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; line-height: 1.6;
  }
  .node-now .now-title { overflow: hidden; text-overflow: ellipsis; }
  .exempt-tag {
    position: absolute; top: 8px; right: 8px;
    font-size: 9px; font-family: var(--mono); color: #d9a441;
    border: 1px solid rgba(217,164,65,.35); background: rgba(217,164,65,.08);
    border-radius: 4px; padding: 1px 6px; line-height: 1.6; letter-spacing: .5px;
  }
  .node-status {
    margin-top: 6px; padding-top: 6px;
    border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; font-family: var(--mono); color: var(--dim);
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .st-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  /* 状态色 */
  .c-todo { background: var(--dim-2); }
  .c-doing { background: var(--blue); }
  .c-blocked { background: var(--accent); }
  .c-review { background: var(--amber); }
  .c-done { background: var(--green); }

  /* ===== 右栏读数面板 ===== */
  .side {
    width: 300px; flex-shrink: 0;
    background: var(--bg-2);
    overflow-y: auto;
    padding: 14px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px;
  }
  .panel-title {
    font-size: 11px; font-family: var(--mono); letter-spacing: 1px;
    color: var(--dim-2); margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  /* v2.20.16：右栏即任务板摘要 —— 「展开」入口 + 阶段分布 + 阶段图例 */
  .panel-more {
    font: inherit; font-size: 11px; letter-spacing: .04em; color: var(--dim);
    background: none; border: 0; padding: 2px 6px; border-radius: 6px;
    cursor: pointer; transition: color .15s, background .15s;
  }
  .panel-more:hover { color: var(--accent); background: var(--panel-2); }
  .panel-more .arw { display: inline-block; transition: transform .18s ease; }
  .panel-more:hover .arw { transform: translateX(3px); }
  .stage-bar {
    display: flex; gap: 2px; height: 5px; border-radius: 999px;
    overflow: hidden; background: var(--panel-2); margin-bottom: 9px;
  }
  .stage-bar .seg { display: block; height: 100%; }
  .stage-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .stage-legend .lg { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--dim); }
  .stage-legend .lg b { font-family: var(--mono); font-weight: 600; color: var(--text); }
  .stage-legend .st-dot { width: 6px; height: 6px; }
  .board-list-title {
    margin: 12px 0 5px; font-size: 10px; font-family: var(--mono);
    color: var(--dim-2); letter-spacing: .05em;
  }
  .c-done { background: var(--green); }
  .big-num { font-size: 28px; font-weight: 700; font-family: var(--mono); color: var(--text); }
  .big-num.warn { color: var(--accent); }
  .big-num.sub { font-size: 14px; color: var(--dim); }
  .readout-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
  .readout-label { font-size: 11px; color: var(--dim); font-family: var(--mono); }
  .readout-val { font-size: 14px; font-weight: 600; font-family: var(--mono); }

  .ev-list { display: flex; flex-direction: column; gap: 8px; }
  .ev-item {
    font-size: 12px; color: var(--dim);
    line-height: 1.45;
    padding: 8px 10px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }
  .ev-item .ev-who { color: var(--text); font-weight: 500; }
  .ev-item .ev-tag {
    display: inline-block; font-size: 10px; font-family: var(--mono);
    padding: 1px 5px; border-radius: 3px; margin-right: 6px;
    border: 1px solid var(--line-2); color: var(--dim-2);
  }
  .ev-item .ev-tag.produce { color: var(--green); border-color: var(--green); }
  .ev-item .ev-tag.report { color: var(--blue); border-color: var(--blue); }
  .ev-item .ev-tag.error { color: var(--accent); border-color: var(--accent); }
  .ev-item .ev-time { font-family: var(--mono); font-size: 10px; color: var(--dim-2); display: block; margin-top: 2px; }

  .pending-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text);
    padding: 7px 9px;
    background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  }
  .pending-item .who { color: var(--dim); font-size: 11px; margin-left: auto; white-space: nowrap; }
  .pending-empty { font-size: 12px; color: var(--dim-2); padding: 6px 2px; font-family: var(--mono); }

  /* ===== 人卡浮层 ===== */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-mask.show { display: flex; }
  .modal-mask.fullscreen { align-items: stretch; justify-content: stretch; padding: 0; }
  .modal-mask.fullscreen .modal, .modal-mask.fullscreen #personCard { width: 100%; max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; border: none; overflow: hidden; display: flex; flex-direction: column; }
  .modal-mask.fullscreen .person-body { flex: 1; min-height: 0; }
  .modal-mask.fullscreen .person-left { max-height: none; height: auto; flex-basis: 380px; }
  .modal-mask.fullscreen .person-right { height: auto; max-height: none; }
  .modal-mask.fullscreen .chat-box, .modal-mask.fullscreen .chat-box.dsh-box { flex: 1; min-height: 0; }
  .modal {
    width: 560px; max-height: 82vh; overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal-ops { display: flex; gap: 8px; margin: 4px 0 2px; flex-wrap: wrap; }
  #personCard { width: 920px; max-width: 94vw; }
  .person-body { display: flex; align-items: stretch; }
  .person-left { flex: 0 0 340px; max-width: 340px; border-right: 1px solid var(--line); max-height: 58vh; overflow-y: auto; }
  .person-left .modal-sec { padding: 14px 18px; }
  /* v2.20.6：交付物列表 + 预览浮层 */
  .art-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; max-height: 190px; overflow-y: auto; }
  .art-item { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; }
  .art-item:hover { background: var(--panel-2); border-color: var(--border); }
  .art-item .art-kind { flex: 0 0 auto; font-size: 13px; line-height: 1; }
  .art-item .art-name { flex: 1; min-width: 0; font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .art-item .art-meta { flex: 0 0 auto; font-size: 10px; color: var(--dim-2); font-family: var(--mono); }
  /* v2.20.16：整行点开预览，右侧 ↗ 直接在新标签页打开原始文件 */
  .art-item .art-open {
    flex: 0 0 auto; font-size: 12px; line-height: 1; color: var(--dim-2);
    padding: 2px 4px; border-radius: 5px; opacity: 0; transition: opacity .12s;
  }
  .art-item:hover .art-open { opacity: 1; }
  .art-item .art-open:hover { color: var(--accent); background: var(--panel); }
  .art-item.art-gone { opacity: .45; cursor: default; }
  .art-item.art-gone:hover { background: none; border-color: transparent; }
  .art-item.art-gone .art-name { text-decoration: line-through; }
  #artPreview { position: fixed; inset: 0; z-index: 200; display: none; background: rgba(0, 0, 0, .72); }
  #artPreview.show { display: flex; align-items: center; justify-content: center; }
  .art-pv-box { width: 88vw; max-width: 1180px; height: 86vh; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 70px rgba(0, 0, 0, .5); }
  .art-pv-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .art-pv-head .t { font-size: 14px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .art-pv-head .p { font-size: 11px; color: var(--dim-2); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .art-pv-body { flex: 1; min-height: 0; overflow: auto; background: var(--bg-2); display: flex; align-items: center; justify-content: center; }
  .art-pv-body img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .art-pv-body iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .art-pv-body video, .art-pv-body audio { max-width: 96%; }

  .person-right { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 56vh; max-height: 56vh; overflow: hidden; }

  .btn.mini:hover { border-color: var(--accent); }
  .btn.mini.danger { color: var(--accent); border-color: var(--accent); }
  .btn.mini.danger:hover { background: var(--accent); color: #fff; }
  .rename-row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .rename-row input { flex: 1; background: var(--bg-2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  .invite-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0; }
  .mode-chip { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; background: transparent; }
  .mode-chip.active { border-color: var(--accent); background: rgba(var(--accent-rgb), .08); }
  .mode-chip span { font-size: 13px; font-weight: 600; color: var(--text); }
  .mode-chip small { font-size: 11px; color: var(--dim); }
  .invite-target { margin: 4px 0; }
  .invite-body { padding: 4px 2px; }
  .invite-tip { font-size: 12px; color: var(--dim); margin: 4px 0 8px; line-height: 1.5; }
  #inviteText { width: 100%; box-sizing: border-box; min-height: 180px; background: var(--bg-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 12.5px; font-family: var(--mono); line-height: 1.55; resize: vertical; }
  .entry-badge { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--dim); margin-left: 6px; vertical-align: 1px; }
  .entry-badge.guide { border-color: var(--accent); color: var(--accent); }
  .entry-badge.api { border-color: var(--blue); color: var(--blue); }
  .entry-badge.cli { border-color: var(--amber); color: var(--amber); }
  .modal-head {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 20px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--panel); z-index: 2;
  }
  .modal-head .badge { width: 44px; height: 44px; font-size: 18px; }
  .modal-name { font-size: 16px; font-weight: 600; }
  .modal-role { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .modal-close { margin-left: auto; cursor: pointer; color: var(--dim); font-size: 18px; border: none; background: none; }
  .modal-close:hover { color: var(--text); }
  /* 人卡头部有两个按钮（全屏 / 关闭）。两个 .modal-close 各带 margin-left:auto 会把
     剩余空白对半分，于是全屏键飘在中间、关闭键贴在右边，看着像错位。把它们包成一组，
     由这一组占住 auto 边距，两个按钮就并排贴在右上角了。 */
  .modal-head-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .modal-head-actions .modal-close { margin-left: 0; padding: 0 6px; line-height: 1; }
  .modal-head-actions .modal-close:hover { color: var(--text); }
  .modal-sec { padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .modal-sec-title { font-size: 11px; font-family: var(--mono); letter-spacing: 1px; color: var(--dim-2); margin-bottom: 10px; }
  .work-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; padding: 6px 0;
  }
  .work-item .t-title { flex: 1; color: var(--text); }
  .work-item .t-id { font-family: var(--mono); font-size: 10px; color: var(--dim-2); }
  .work-empty { font-size: 12px; color: var(--dim-2); font-family: var(--mono); }
  .chat-box {
    display: flex; gap: 8px; margin-top: 10px;
  }
  .chat-box input {
    flex: 1; background: var(--bg-2); border: 1px solid var(--line-2);
    border-radius: var(--radius-sm); padding: 8px 12px;
    color: var(--text); font-size: 13px; font-family: var(--sans);
    outline: none;
  }
  .chat-box input:focus { border-color: var(--accent); }
  .chat-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; max-height: 220px; overflow-y: auto; }
  .chat-item { font-size: 12px; color: var(--dim); line-height: 1.4; }

  .chat-item .time { font-family: var(--mono); font-size: 10px; color: var(--dim-2); margin-left: 6px; }

  .rel-select { display: flex; align-items: center; gap: 8px; }
  .rel-select select {
    background: var(--bg-2); color: var(--text); border: 1px solid var(--line-2);
    border-radius: var(--radius-sm); padding: 6px 10px; font-size: 12px; font-family: var(--sans);
    outline: none;
  }
  .rel-select select:focus { border-color: var(--accent); }

  /* ===== 加位子弹窗 ===== */
  .pos-form { display: flex; flex-direction: column; gap: 10px; padding: 18px 20px; }
  .pos-form input {
    background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--radius-sm);
    padding: 9px 12px; color: var(--text); font-size: 13px; font-family: var(--sans); outline: none;
  }
  .pos-form input:focus { border-color: var(--accent); }
  .pos-form .row { display: flex; gap: 8px; }
  .pos-form .row input:first-child { flex: 1; }
  .pos-form .row input:nth-child(2) { flex: 1.6; }
  .pos-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  /* 空态 */
  .empty-state {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; color: var(--dim); font-size: 13px; line-height: 1.8;
  }
  .empty-state .big { font-size: 16px; color: var(--text); margin-bottom: 6px; }

  @media (max-width: 900px) {
    .side { width: 240px; }
  }

  /* ===== 终端会话（dsh 进程托管）===== */
  .dsh-status { font-size: 11px; font-family: var(--mono); color: var(--dim-2); margin: 6px 0 2px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  /* 右侧那三个按钮（自动唤醒 / 提醒 / 清空会话）包成一组统一靠右：
     之前 auto 边距只挂在「自动唤醒」上，窗口一窄就把它连同后面的按钮挤到下一行，
     而且换行点随宽度漂移。成组后整组要么在右、要么整组换行，位置稳定。 */
  .dsh-status-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .dsh-status .ok { color: #3fb950; }
  .dsh-approval-list { display: flex; flex-direction: column; gap: 6px; margin: 6px 0; }
  .dsh-approval { border: 1px solid rgba(234, 179, 8, .45); background: rgba(234, 179, 8, .07); border-radius: 10px; padding: 8px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 5px; }
  .dsh-approval .apv-head { font-weight: 600; color: var(--text); }
  .dsh-approval .apv-tool { font-family: var(--mono); color: #eab308; }
  .dsh-approval .apv-reason { color: var(--dim-1); line-height: 1.45; word-break: break-word; max-height: 72px; overflow-y: auto; }
  .dsh-approval .apv-actions { display: flex; gap: 8px; }
  .dsh-approval .apv-tip { font-size: 11px; color: var(--dim-2); }
  .dsh-approval.apv-done-allow { border-color: rgba(63, 185, 80, .4); background: rgba(63, 185, 80, .06); }
  .dsh-approval.apv-done-reject { border-color: rgba(248, 81, 73, .4); background: rgba(248, 81, 73, .06); opacity: .75; }
  .dsh-approval .apv-done { font-weight: 600; color: var(--text); }
  .dsh-msgs { max-height: none; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 2px; }
  .dsh-msg { max-width: 88%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .dsh-msg.user { align-self: flex-end; background: #444; color: #fff; }
  .dsh-msg.assistant { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); }
  /* v2.19.3：思考折叠块 + 工作进展指示 */
  .dsh-thinking { align-self: flex-start; max-width: 88%; background: var(--panel-2); border: 1px dashed var(--line); border-radius: 10px; padding: 6px 10px; font-size: 12px; color: var(--dim-1); }
  .dsh-thinking summary { cursor: pointer; font-weight: 600; color: var(--text); user-select: none; }
  .dsh-thinking .th-body { margin-top: 6px; white-space: pre-wrap; word-break: break-word; line-height: 1.5; max-height: 220px; overflow-y: auto; }
  .dsh-msg.thinking { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); color: var(--dim-1); font-size: 12px; animation: dshPulse 1.4s ease-in-out infinite; }
  @keyframes dshPulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  .dsh-msg.thinking { align-self: flex-start; background: transparent; border: 1px dashed var(--line-2); color: var(--dim); font-size: 12px; }
  .dsh-msg .who { font-size: 10px; font-family: var(--mono); color: var(--dim-2); display: block; margin-bottom: 3px; }
  /* v2.20.13：Agent 回复按 markdown 排版（表格/列表/代码块），用户自己打的字保持原样 */
  .dsh-msg .md { white-space: normal; }
  .dsh-msg .md > *:first-child { margin-top: 0; }
  .dsh-msg .md > *:last-child { margin-bottom: 0; }
  .dsh-msg .md p { margin: 6px 0; }
  .dsh-msg .md h1, .dsh-msg .md h2, .dsh-msg .md h3 { margin: 12px 0 6px; line-height: 1.35; }
  .dsh-msg .md h1 { font-size: 16px; } .dsh-msg .md h2 { font-size: 14.5px; } .dsh-msg .md h3 { font-size: 13.5px; }
  .dsh-msg .md ul, .dsh-msg .md ol { margin: 6px 0; padding-left: 22px; }
  .dsh-msg .md li { margin: 2px 0; }
  .dsh-msg .md li.md-task { list-style: none; margin-left: -18px; }
  .dsh-msg .md li.md-task input { margin-right: 5px; }
  .dsh-msg .md code { font-family: var(--mono); font-size: 12px; background: var(--panel); border: 1px solid var(--line); padding: 1px 4px; border-radius: 4px; }
  .dsh-msg .md pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; overflow-x: auto; white-space: pre; }
  .dsh-msg .md pre code { background: none; border: 0; padding: 0; }
  .dsh-msg .md a { color: var(--accent); }
  .dsh-msg .md blockquote { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--line-2); color: var(--dim-1); }
  .dsh-msg .md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .dsh-msg .md table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; display: block; overflow-x: auto; max-width: 100%; }
  .dsh-msg .md th, .dsh-msg .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  .dsh-msg .md th { background: var(--panel); font-weight: 600; }
  .dsh-msg.md-wide { max-width: 100%; }
  .dsh-usage { font-size: 10px; font-family: var(--mono); color: var(--dim-2); padding: 4px 0 0 2px; }
  .dsh-input-row { display: flex; gap: 8px; margin-top: 8px; }

</style>

<script>
/* ===== AgentNexus · 组织视图 v2.9 ===== */
const THEME_ORDER = ['nothing', 'apple', 'premium'];
const THEME_NEXT_LABEL = { nothing: 'A // 亮色', apple: 'P // Premium', premium: 'N // 暗色' };
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('agentnexus_theme', t); } catch (e) {}
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = THEME_NEXT_LABEL[t] || 'A // 亮色';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'nothing';
  applyTheme(THEME_ORDER[(THEME_ORDER.indexOf(cur) + 1) % THEME_ORDER.length]);
}
(function initTheme() {
  let saved = 'nothing';
  try { saved = localStorage.getItem('agentnexus_theme') || 'nothing'; } catch (e) {}
  if (!THEME_ORDER.includes(saved)) saved = 'nothing';
  applyTheme(saved);
})();

/* ===== 状态 ===== */
const params = new URLSearchParams(location.search);
const PROJECT = params.get('project') || '';
let board = null;      // 看板数据
let nodePos = {};      // agent_id -> {x, y, level}
let agentById = {};
let editMode = false;

const STATUS_ORDER = ['blocked', 'in_progress', 'review', 'todo', 'done'];
const STATUS_LABEL = { todo: '待做', in_progress: '进行中', blocked: '卡壳', review: '待验收', done: '完成' };
const AGENT_COLORS = ['#e5484d', '#f5a524', '#30a46c', '#4c8dff', '#9c7bd8', '#f76808', '#12b5c9', '#d95d9e'];
function colorForAgent(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return AGENT_COLORS[h % AGENT_COLORS.length];
}
function badgeText(name) {
  const n = (name || '?').trim();
  return n ? Array.from(n)[0].toUpperCase() : '?';
}
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const p = (x) => String(x).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===== 消息兼容层（v2.20.6）=====
   messages[] 里历史并存两种字段家族：
     ① server 写入族：sender / content / timestamp / to(字符串)
     ② Agent 手写族：from / body|text / ts / to(字符串或数组)
   前端原先只认 ①，于是 ② 的消息内容空白、发送者无名，且 `m.to === agentId`
   对数组恒为 false（@ 判定失效）。这里在数据入口归一一次，下游全部受益。 */
const MSG_SENDER_KEYS = ['sender', 'from', 'author', 'agent', 'agent_id', 'agentId', 'by'];
const MSG_CONTENT_KEYS = ['content', 'body', 'text', 'message', 'note', 'msg', 'detail'];
const MSG_TIME_KEYS = ['timestamp', 'ts', 'time', 'created_at', 'createdAt', 'at', 'date'];
function _msgPick(m, keys) {
  for (const k of keys) { const v = m[k]; if (v != null && v !== '') return v; }
  return undefined;
}
function _msgSender(m) {
  const v = _msgPick(m, MSG_SENDER_KEYS);
  return v == null ? '' : String(typeof v === 'object' ? (v.id || v.name || '') : v);
}
function _msgContent(m) {
  const v = _msgPick(m, MSG_CONTENT_KEYS);
  if (v == null) return '';
  if (typeof v === 'string') return v;
  try { return JSON.stringify(v); } catch (e) { return String(v); }
}
function _msgTime(m) {
  const v = _msgPick(m, MSG_TIME_KEYS);
  if (v == null) return '';
  if (typeof v === 'number') {           // 秒 / 毫秒都容忍
    const ms = v < 1e12 ? v * 1000 : v;
    const d = new Date(ms);
    if (!isNaN(d.getTime())) return d.toISOString().slice(0, 19).replace('T', ' ');
    return '';
  }
  return String(v);
}
function _msgTo(m) {
  const v = _msgPick(m, ['to', 'to_ids', 'toIds', 'recipients', 'receiver']);
  if (v == null) return [];
  if (Array.isArray(v)) return v.filter(x => x != null && x !== '').map(x => String(typeof x === 'object' ? (x.id || x.name || '') : x)).filter(Boolean);
  if (typeof v === 'object') return Object.keys(v).filter(k => v[k]);
  const s = String(v).trim();
  if (!s) return [];
  // 整体就是某个成员（id 或姓名，姓名可能含空格，如「Builder 4试玩反馈」）→ 不再拆分
  if (!/[,，;；]/.test(s) && typeof agentById === 'object' && agentById) {
    const bare = s.replace(/^@+/, '').toLowerCase().replace(/\s+/g, '');
    for (const id in agentById) {
      const a = agentById[id] || {};
      const nm = String(a.name || '').toLowerCase().replace(/\s+/g, '');
      if (id.toLowerCase() === bare || (nm && nm === bare)) return [s];
    }
  }
  return s.split(/[,，;；\s]+/).filter(Boolean);
}
// 把一个 @引用 / id / 姓名 / 历史别名 解析成名册里的 agent id（解析不到返回 ''）
function resolveAgentRef(ref) {
  if (ref == null) return '';
  const bare = String(ref).trim().replace(/^@+/, '');
  if (!bare) return '';
  if (typeof agentById !== 'object' || !agentById) return '';
  if (agentById[bare]) return bare;
  const low = bare.toLowerCase();
  const compact = low.replace(/\s+/g, '');
  for (const id in agentById) {
    const a = agentById[id] || {};
    const nm = String(a.name || '');
    if (id.toLowerCase() === low) return id;
    if (nm && (nm.toLowerCase() === low || nm.toLowerCase().replace(/\s+/g, '') === compact)) return id;
  }
  // 历史别名兜底：builder4 →「Builder 4试玩反馈」、builder5玩法 → builder5、builder3UI → builder3UI设计
  // 取「最长匹配」以免 builder5 被 builder 抢走
  let best = '';
  for (const id in agentById) {
    if (!id || id === 'user') continue;
    const idc = id.toLowerCase().replace(/\s+/g, '');
    if (idc.startsWith(compact) || compact.startsWith(idc)) { if (id.length > best.length) best = id; }
  }
  return best;
}
function normalizeMessages(list) {
  return (list || []).map(m => {
    if (!m || typeof m !== 'object') return m;
    const to = _msgTo(m);
    const out = Object.assign({}, m, {
      sender: _msgSender(m),
      content: _msgContent(m),
      timestamp: _msgTime(m),
      _toList: to,
    });
    if (out.id == null) out.id = (m.msg_id != null ? m.msg_id : m.message_id);
    return out;
  });
}
// 该消息是否指向某人（兼容 to 为字符串 / 数组 / 空格或逗号分隔的多目标 / 历史别名）
function msgTargets(m, agentId) {
  if (!m || !agentId) return false;
  if (m.sender === agentId) return true;
  const to = (m._toList && m._toList.length) ? m._toList : _msgTo(m);
  if (!to.length) return false;
  for (const t of to) {
    const bare = String(t).trim().replace(/^@+/, '').toLowerCase();
    if (!bare) continue;
    if (bare === 'all' || bare === '*' || bare === '所有人' || bare === '全员' || bare === '全体') return true;
    if (resolveAgentRef(t) === agentId) return true;
  }
  return false;
}
// 「发给谁」的可读文案（id → 姓名，去重，解析不到的别名原样保留）
function msgToText(m) {
  const to = (m && m._toList && m._toList.length) ? m._toList : _msgTo(m);
  if (!to.length) return '所有人';
  const seen = {}; const out = [];
  for (const t of to) {
    const bare = String(t).trim().replace(/^@+/, '');
    if (!bare) continue;
    const low = bare.toLowerCase();
    if (low === 'all' || low === '*' || low === '所有人' || low === '全员' || low === '全体') {
      if (!seen['\u0000all']) { seen['\u0000all'] = 1; out.push('所有人'); }
      continue;
    }
    const id = resolveAgentRef(t);
    const label = id ? ((agentById[id] && agentById[id].name) || id) : bare;
    if (!seen[label]) { seen[label] = 1; out.push(label); }
  }
  return out.length ? out.join('、') : '所有人';
}

/* ===== 数据 ===== */
async function loadBoard() {
  const resp = await fetch('/api/board' + (PROJECT ? `?project=${encodeURIComponent(PROJECT)}` : ''));
  if (!resp.ok) throw new Error('board 加载失败 ' + resp.status);
  board = await resp.json();
  agentById = {};
  for (const a of (board.agents || [])) agentById[a.id] = a;
  board.messages = normalizeMessages(board.messages);
  if (!board.project_info) board.project_info = {};
  document.getElementById('projName').textContent = board.project_info.project_name || PROJECT || '未命名项目';
  const ws = board.project_info.workspace || board.workspace || '';
  document.getElementById('projMeta').textContent =
    (board.project_info.project_desc ? '目标：' + board.project_info.project_desc : '') +
    (ws ? ' · ' + ws : '');
  renderLegend();
  render();
  renderSide();
}

/* ===== 布局：树形分层 ===== */
function buildLevels() {
  const agents = board.agents || [];
  // 默认扁平：无 reports_to 的（user 强制第一）
  const childrenOf = {};
  const roots = [];
  const byId = {};
  for (const a of agents) {
    byId[a.id] = a;
    const rid = (a.reports_to || '').trim() || null;
    if (rid && byId[rid]) {
      (childrenOf[rid] = childrenOf[rid] || []).push(a);
    } else {
      roots.push(a);
    }
  }
  // 排序：user 永远第一
  roots.sort((a, b) => (a.id === 'user' ? -1 : b.id === 'user' ? 1 : 0));
  for (const k of Object.keys(childrenOf)) childrenOf[k].sort((a, b) => (a.id === 'user' ? -1 : b.id === 'user' ? 1 : 0));
  // BFS 分层
  const levels = [];
  const pos = {};
  const queue = roots.map(r => ({ a: r, level: 0 }));
  const visited = new Set();
  while (queue.length) {
    const { a, level } = queue.shift();
    if (visited.has(a.id)) continue;
    visited.add(a.id);
    (levels[level] = levels[level] || []).push(a);
    pos[a.id] = level;
    for (const c of (childrenOf[a.id] || [])) queue.push({ a: c, level: level + 1 });
  }
  // 孤立节点兜底（reports_to 指向不存在的）
  for (const a of agents) {
    if (!visited.has(a.id)) {
      (levels[0] = levels[0] || []).push(a);
      pos[a.id] = 0;
    }
  }
  return { levels, pos };
}

/* ===== 任务推导 ===== */
function tasksOf(agentId) {
  return (board.tasks || []).filter(t => t.assignee === agentId);
}
function agentStatus(agentId) {
  const ts = tasksOf(agentId);
  const active = ts.filter(t => t.status !== 'done');
  if (!active.length) return { key: 'done', label: '手上没活', color: 'var(--green)' };
  let worst = null;
  for (const t of active) {
    const k = t.status || 'todo';
    if (!worst || STATUS_ORDER.indexOf(k) < STATUS_ORDER.indexOf(worst)) worst = k;
  }
  return { key: worst, label: STATUS_LABEL[worst] || worst, color: 'var(--accent)' };
}

/* ===== 画布缩放（v2.15.2） ===== */
let ZOOM = 1, lastTotalW = 1200, lastTotalH = 800;
try { ZOOM = parseFloat(localStorage.getItem('agentnexus_zoom_' + PROJECT)) || 1; } catch (e) {}
function clampZoom(z) { return Math.max(0.15, Math.min(3, z)); }
function applyZoom() {
  const zl = document.getElementById('zoomLayer');
  if (!zl) return;
  ZOOM = clampZoom(ZOOM);
  zl.style.transform = 'scale(' + ZOOM + ')';
  zl.style.width = (lastTotalW * ZOOM) + 'px';
  zl.style.height = (lastTotalH * ZOOM) + 'px';
  const pct = document.getElementById('zoomPct');
  if (pct) pct.textContent = Math.round(ZOOM * 100) + '%';
  try { localStorage.setItem('agentnexus_zoom_' + PROJECT, String(ZOOM)); } catch (e) {}
}
function zoomBy(dir) { ZOOM = clampZoom(ZOOM * (dir > 0 ? 1.2 : 1 / 1.2)); applyZoom(); }
function zoomFit() {
  const wrap = document.getElementById('canvasWrap');
  if (!wrap || !lastTotalW) return;
  const z = Math.min(wrap.clientWidth / lastTotalW, wrap.clientHeight / lastTotalH);
  ZOOM = clampZoom(z > 1.5 ? 1.5 : z);
  applyZoom();
  wrap.scrollLeft = 0; wrap.scrollTop = 0;
}
(function initZoomWheel() {
  const wrap = document.getElementById('canvasWrap');
  if (!wrap) return;
  wrap.addEventListener('wheel', (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const oldZ = ZOOM;
    const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    const nz = clampZoom(oldZ * f);
    if (nz === oldZ) return;
    const cx = (wrap.scrollLeft + mx) / oldZ;
    const cy = (wrap.scrollTop + my) / oldZ;
    ZOOM = nz;
    applyZoom();
    wrap.scrollLeft = cx * ZOOM - mx;
    wrap.scrollTop = cy * ZOOM - my;
  }, { passive: false });
})();

/* ===== 三栏宽度可拖动（v2.20.6）===== */
(function initSplitters() {
  const main = document.querySelector('.main');
  const left = document.getElementById('projBar');
  const right = document.getElementById('sidePanel');
  const sL = document.getElementById('splitLeft');
  const sR = document.getElementById('splitRight');
  if (!main || !left || !right || !sL || !sR) return;
  const KEY = 'agentnexus_split';
  const LIM = { left: [130, 480], right: [200, 720] };
  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        left: Math.round(left.getBoundingClientRect().width),
        right: Math.round(right.getBoundingClientRect().width)
      }));
    } catch (e) {}
  }
  try {
    const v = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (v.left) left.style.flex = '0 0 ' + v.left + 'px';
    if (v.right) right.style.flex = '0 0 ' + v.right + 'px';
  } catch (e) {}
  function bind(el, splitter, side) {
    splitter.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try { splitter.setPointerCapture(e.pointerId); } catch (err) {}
      splitter.classList.add('dragging');
      document.body.classList.add('col-resizing');
      const startX = e.clientX;
      const startW = el.getBoundingClientRect().width;
      const lo = LIM[side][0], hi = LIM[side][1];
      const onMove = (ev) => {
        const d = side === 'left' ? (ev.clientX - startX) : (startX - ev.clientX);
        const w = Math.max(lo, Math.min(hi, startW + d));
        el.style.flex = '0 0 ' + w + 'px';
      };
      const onUp = () => {
        splitter.classList.remove('dragging');
        document.body.classList.remove('col-resizing');
        splitter.removeEventListener('pointermove', onMove);
        splitter.removeEventListener('pointerup', onUp);
        splitter.removeEventListener('pointercancel', onUp);
        persist();
      };
      splitter.addEventListener('pointermove', onMove);
      splitter.addEventListener('pointerup', onUp);
      splitter.addEventListener('pointercancel', onUp);
    });
    splitter.addEventListener('dblclick', () => {
      el.style.flex = '';
      persist();
    });
  }
  bind(left, sL, 'left');
  bind(right, sR, 'right');
})();

/* ===== 左栏收起（v2.20.17）===== */
// 收起后画布变宽，收起状态记在 localStorage；分隔条也一起藏掉，否则会留一条空缝
function toggleProjBar(collapse) {
  const on = (collapse === undefined)
    ? !document.body.classList.contains('proj-collapsed')
    : !!collapse;
  document.body.classList.toggle('proj-collapsed', on);
  try { localStorage.setItem('agentnexus_projbar', on ? 'collapsed' : 'open'); } catch (e) {}
}
(function initProjBar() {
  let v = '';
  try { v = localStorage.getItem('agentnexus_projbar') || ''; } catch (e) {}
  if (v === 'collapsed') document.body.classList.add('proj-collapsed');
})();

/* ===== 空白处按住左键拖动整个画布（v2.20.17）===== */
// 用滚动容器的 scrollLeft/scrollTop 做平移：不动任何布局，节点坐标、连线、缩放全都不受影响。
// 节点自己有一套 pointerdown 拖拽（enableNodeDrag），所以这里必须放过 .node 及其子元素，
// 否则点节点会变成拖画布。
(function initCanvasPan() {
  const wrap = document.getElementById('canvasWrap');
  if (!wrap) return;
  let sx = 0, sy = 0, sl = 0, st = 0, panning = false;
  wrap.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('.node')) return;
    if (e.target.closest('button, a, input, select, textarea')) return;
    panning = true;
    sx = e.clientX; sy = e.clientY;
    sl = wrap.scrollLeft; st = wrap.scrollTop;
    try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!panning) return;
    wrap.scrollLeft = sl - (e.clientX - sx);
    wrap.scrollTop = st - (e.clientY - sy);
    if (!wrap.classList.contains('panning')) {
      wrap.classList.add('panning');
      document.body.classList.add('canvas-panning');
    }
  });
  const end = () => {
    if (!panning) return;
    panning = false;
    wrap.classList.remove('panning');
    document.body.classList.remove('canvas-panning');
  };
  wrap.addEventListener('pointerup', end);
  wrap.addEventListener('pointercancel', end);
  // 拖出窗口再松手也要收尾
  window.addEventListener('blur', end);
})();

/* ===== 渲染 ===== */
function render() {
  const { levels, pos } = buildLevels();
  const layer = document.getElementById('nodeLayer');
  const svg = document.getElementById('orgCanvas');
  const W = 320, H = 162, PAD_X = 40, GAP_X = 24, LEVEL_GAP = 150, TOP = 70;
  const LAYER_GAP_X = 430, COL_GAP_Y = 30;
  let LAYOUT_DIR = 'lr';
  try { LAYOUT_DIR = localStorage.getItem('agentnexus_layout_' + PROJECT) || 'lr'; } catch (e) {}
  const lr = LAYOUT_DIR === 'lr';
  const lbl = document.getElementById('btn-layout');
  if (lbl) lbl.textContent = lr ? '⇄ 左右' : '⇄ 上下';
  const maxW = Math.max(...levels.map(l => l.length)) || 1;
  let totalW, totalH;
  if (lr) {
    totalW = PAD_X * 2 + (levels.length - 1) * LAYER_GAP_X + W;
    totalH = TOP + maxW * H + (maxW - 1) * COL_GAP_Y + 60;
  } else {
    totalW = PAD_X * 2 + maxW * W + (maxW - 1) * GAP_X;
    totalH = TOP + levels.length * LEVEL_GAP + H + 60;
  }
  layer.style.width = totalW + 'px';
  layer.style.height = totalH + 'px';
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
  lastTotalW = totalW; lastTotalH = totalH;
  applyZoom();
  nodePos = {};
  // 节点定位
  let html = '';
  const order = [];
  window.orderCache = order;
  levels.forEach((list, li) => {
    let baseX, baseY;
    if (lr) {
      baseX = PAD_X + li * LAYER_GAP_X;
      const colH = list.length * H + (list.length - 1) * COL_GAP_Y;
      baseY = Math.max(TOP, (totalH - colH) / 2);
    } else {
      const rowW = PAD_X * 2 + list.length * W + (list.length - 1) * GAP_X;
      baseX = (totalW - rowW) / 2;
      baseY = TOP + li * LEVEL_GAP;
    }
    list.forEach((a, i) => {
      let x = baseX + (lr ? 0 : i * (W + GAP_X));
      let yNode = baseY + (lr ? i * (H + COL_GAP_Y) : 0);
      // v2.12：恢复手动拖拽位置（按 项目+agent 存 localStorage）
      try {
        const saved = JSON.parse(localStorage.getItem('agentnexus_pos_' + PROJECT + '_' + a.id));
        if (saved && typeof saved.x === 'number' && typeof saved.y === 'number') { x = saved.x; yNode = saved.y; }
      } catch (e) {}
      nodePos[a.id] = { x, y: yNode, w: W, h: H, level: li };
      order.push(a);
      const st = agentStatus(a.id);
      const color = a.color || colorForAgent(a.id);
      const _openTs = tasksOf(a.id).filter(t => t.status !== 'done');
      const topTask = _openTs.length ? _openTs.reduce((b, t) => STATUS_ORDER.indexOf(t.status || 'todo') < STATUS_ORDER.indexOf(b.status || 'todo') ? t : b) : null;
      const isUser = a.id === 'user';
      html += `<div class="node ${isUser ? 'user-node' : ''} ${editMode ? '' : ''}" id="node-${esc(a.id)}"
        data-id="${esc(a.id)}" onclick="openPerson('${esc(a.id)}')" style="left:${x}px;top:${yNode}px;">
        <div class="node-head">
          <div class="badge" style="background:${color};">${esc(badgeText(a.name || a.id))}</div>
          <div>
            <div class="node-name">${esc(a.name || a.id)}${isUser ? ' <span style="font-size:10px;color:var(--dim-2);">(我)</span>' : ''}</div>
            <div class="node-role">${esc(a.role || '未设定身份')}</div>
          </div>
        </div>
        <div class="node-status">
          <span><span class="status-dot" style="background:${st.color};"></span>${st.label}</span>
          <span style="color:var(--dim-2);">${tasksOf(a.id).length ? tasksOf(a.id).length + ' 任务' : '·'}</span>
        </div>
        ${topTask ? `<div class="node-now"><span class="now-tag">在途</span><span class="now-title">${esc(topTask.title)}</span></div>` : ''}
        ${(board && board.protocol && board.protocol.mode === 'off' && (board.protocol.exemptions || []).indexOf(a.id) >= 0) ? '<span class="exempt-tag">豁免</span>' : ''}
      </div>`;
    });
  });
  layer.innerHTML = html;
  document.getElementById('emptyState').style.display = order.length ? 'none' : 'block';
  enableNodeDrag();
  renderLines(order);
}

/* ===== 节点拖拽（v2.12） ===== */
function enableNodeDrag() {
  document.querySelectorAll('.node').forEach(el => {
    let sx = 0, sy = 0, ox = 0, oy = 0, dragging = false, moved = false;
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      dragging = true; moved = false;
      sx = e.clientX; sy = e.clientY;
      const cs = getComputedStyle(el);
      ox = parseFloat(cs.left) || 0; oy = parseFloat(cs.top) || 0;
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      if (!moved) return;
      el.classList.add('dragging');
      const z = ZOOM || 1;
      el.style.left = (ox + dx / z) + 'px';
      el.style.top = (oy + dy / z) + 'px';
      const id = el.dataset.id;
      const p = nodePos[id];
      if (p) { p.x = ox + dx / z; p.y = oy + dy / z; }
      if (window.orderCache) renderLines(window.orderCache);
    });
    const end = (e) => {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      if (moved) {
        const id = el.dataset.id;
        const p = nodePos[id];
        if (p) {
          try { localStorage.setItem('agentnexus_pos_' + PROJECT + '_' + id, JSON.stringify({ x: p.x, y: p.y })); } catch (err) {}
          el._suppressClick = true;
        }
      }
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('click', (e) => {
      if (el._suppressClick) { e.stopPropagation(); el._suppressClick = false; }
    }, true);
  });
}

/* ===== 连线 ===== */
function renderLines(order) {
  const svg = document.getElementById('orgCanvas');
  const ns = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  const defs = document.createElementNS(ns, 'defs');
  const mkMarker = (id, color, dash) => {
    const m = document.createElementNS(ns, 'marker');
    m.setAttribute('id', id);
    m.setAttribute('viewBox', '0 0 10 10');
    m.setAttribute('refX', dash ? 4 : 8);
    m.setAttribute('refY', '5');
    m.setAttribute('markerWidth', '5');
    m.setAttribute('markerHeight', '5');
    m.setAttribute('orient', 'auto-start-reverse');
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', 'M0,0 L10,5 L0,10 z');
    path.setAttribute('fill', color);
    m.appendChild(path);
    defs.appendChild(m);
  };
  mkMarker('arr-report', 'var(--dim-2)', false);
  mkMarker('arr-collab', 'var(--blue)', true);
  mkMarker('arr-dep', 'var(--amber)', true);
  svg.appendChild(defs);
  const CS = getComputedStyle(document.documentElement);
  const colorVar = (v) => {
    try { return CS.getPropertyValue(v).trim() || v; } catch (e) { return v; }
  };
  const dim2 = colorVar('--dim-2'), blue = colorVar('--blue'), amber = colorVar('--amber');
  const lr = (() => { try { return (localStorage.getItem('agentnexus_layout_' + PROJECT) || 'lr') === 'lr'; } catch (e) { return true; } })();
  // 端口：out = 父侧出线端（下/右），in = 子侧入线端（上/左）
  const port = (id, dir) => {
    const p = nodePos[id]; if (!p) return null;
    // 出线取中点、入线取 0.3h：进出错开，避免父子同高时"线穿堂"的视觉直通
    if (lr) return dir === 'out' ? { x: p.x + p.w, y: p.y + p.h / 2 } : { x: p.x, y: p.y + p.h * 0.3 };
    return dir === 'out' ? { x: p.x + p.w / 2, y: p.y + p.h } : { x: p.x + p.w / 2, y: p.y };
  };
  // 横平竖直的正交线（v2.13.2 纯直角，圆角统一由交汇圆点替代）
  const ortho = (x1, y1, x2, y2) => {
    if (lr) {
      if (Math.abs(y1 - y2) < 1) return `M${x1},${y1} L${x2},${y2}`;
      const mx = (x1 + x2) / 2;
      return `M${x1},${y1} L${mx},${y1} L${mx},${y2} L${x2},${y2}`;
    }
    if (Math.abs(x1 - x2) < 1) return `M${x1},${y1} L${x2},${y2}`;
    const my = (y1 + y2) / 2;
    return `M${x1},${y1} L${x1},${my} L${x2},${my} L${x2},${y2}`;
  };
  const lines = [];
  // 1) 汇报线（实线）：reports_to -> agent，同父共享总线 + 分叉交汇点（v2.13.2）
  const dots = [];
  const groups = {};
  for (const a of (board.agents || [])) {
    const rid = (a.reports_to || '').trim();
    if (rid && nodePos[a.id] && nodePos[rid]) (groups[rid] = groups[rid] || []).push(a.id);
  }
  for (const rid of Object.keys(groups)) {
    const kids = groups[rid].filter(k => nodePos[k]);
    if (!kids.length || !nodePos[rid]) continue;
    const o = port(rid, 'out');
    let bus;
    if (lr) {
      const busX = Math.max(o.x + 20, Math.min(...kids.map(k => nodePos[k].x)) - 40);
      bus = { x: busX, y: o.y };
      for (const k of kids) {
        const ipt = port(k, 'in');
        const iy = ipt ? ipt.y : nodePos[k].y + nodePos[k].h / 2;
        lines.push({ d: `M${o.x},${o.y} L${busX},${o.y} L${busX},${iy} L${nodePos[k].x},${iy}`, color: dim2, dash: '', marker: 'arr-report', cls: 'report', width: 1.6, hub: { x: busX, y: iy } });
      }
    } else {
      const busY = Math.max(o.y + 20, Math.min(...kids.map(k => nodePos[k].y)) - 40);
      bus = { x: o.x, y: busY };
      for (const k of kids) {
        const ipt = port(k, 'in');
        const ix = ipt ? ipt.x : nodePos[k].x + nodePos[k].w / 2;
        lines.push({ d: `M${o.x},${o.y} L${o.x},${busY} L${ix},${busY} L${ix},${nodePos[k].y}`, color: dim2, dash: '', marker: 'arr-report', cls: 'report', width: 1.6, hub: { x: ix, y: busY } });
      }
    }
    if (kids.length >= 2) dots.push(bus);
  }
  // 2) 协作线（虚线）：同一未完成任务的不同 assignee
  const seen = new Set();
  for (const t of (board.tasks || [])) {
    if (!t.assignee || t.status === 'done') continue;
    const related = (board.tasks || []).filter(x => x.id === t.id);
    // 依赖链上的相邻 assignee 也算协作
    const dl = t.depends_on;
    const deps = Array.isArray(dl) ? dl : (typeof dl === 'string' ? dl.split(/[,，]/).map(x => x.trim()).filter(Boolean) : []);
    for (const depId of deps) {
      const dep = (board.tasks || []).find(x => x.id === depId);
      if (dep && dep.assignee && dep.assignee !== t.assignee) {
        const key = [dep.assignee, t.assignee].sort().join('|');
        if (!seen.has(key) && nodePos[dep.assignee] && nodePos[t.assignee]) {
          seen.add(key);
          lines.push({
            d: (() => { const o2 = port(dep.assignee, 'out'), i2 = port(t.assignee, 'in'); return (o2 && i2) ? ortho(o2.x, o2.y, i2.x, i2.y) : ''; })(),
            color: amber, dash: '3 4', marker: 'arr-dep', cls: 'dep', width: 1.2
          });
        }
      }
    }
  }
  // 3) 同任务协作：同一任务多个 assignee？当前任务模型单 assignee，跳过；改为：同一依赖组的协作
  for (const l of lines) {
    const g = document.createElementNS(ns, 'path');
    g.setAttribute('d', l.d);
    g.setAttribute('fill', 'none');
    g.setAttribute('stroke', l.color);
    g.setAttribute('stroke-width', l.width || (l.cls === 'report' ? 1.6 : 1.2));
    if (l.dash) g.setAttribute('stroke-dasharray', l.dash);
    g.setAttribute('marker-end', `url(#${l.marker})`);
    g.setAttribute('opacity', l.cls === 'report' ? 0.8 : 0.55);
    svg.appendChild(g);
    if (l.hub) {
      const c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', l.hub.x); c.setAttribute('cy', l.hub.y);
      c.setAttribute('r', 3.2); c.setAttribute('fill', l.color); c.setAttribute('opacity', 0.9);
      svg.appendChild(c);
    }
  }
  for (const d of dots) {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', d.x); c.setAttribute('cy', d.y);
    c.setAttribute('r', 3.2); c.setAttribute('fill', dim2); c.setAttribute('opacity', 0.9);
    svg.appendChild(c);
  }
}

  const pending = openTasks.filter(t => t.assignee && t.assignee !== 'user');
  // 最近发生：messages 倒序
  const recent = [...messages].sort((a, b) => (a.timestamp || '').localeCompare(b.timestamp || ''));
  const recentN = recent.slice(-8).reverse();
  const evTag = (text) => {
    const t = (text || '').toLowerCase();
    if (/(报到|接入|注册|进入)/.test(text)) return '<span class="ev-tag report">报到</span>';
    if (/(完成|交付|产出|提交|done)/.test(text)) return '<span class="ev-tag produce">产出</span>';
    if (/(报错|失败|错误|挂|exit|非零|blocked)/.test(t)) return '<span class="ev-tag error">报错</span>';
    return '<span class="ev-tag">消息</span>';
  };

  // v2.20.16：右栏就是「任务板最上面那段总结」——阶段分布用与看板同名的阶段词与同一套状态色
  const STAGES = [

    { key: 'in_progress', label: '进行中', cls: 'c-doing' },
    { key: 'review',      label: '待验收', cls: 'c-review' },
    { key: 'blocked',     label: '阻塞',   cls: 'c-blocked' },
    { key: 'done',        label: '已完成', cls: 'c-done' },

  const stages = STAGES.map(s => ({ ...s, n: tasks.filter(t => (t.status || 'todo') === s.key).length }))
                       .filter(s => s.n > 0);
  side.innerHTML = `

      <div class="stage-legend">${stages.map(s => `<span class="lg"><i class="st-dot ${s.cls}"></i>${s.label} <b>${s.n}</b></span>`).join('')}</div>` : ''}
      <div class="board-list-title">未闭合 ${pending.length}</div>
      ${pending.length ? pending.slice(0, 6).map(t => `
        <div class="pending-item">
          <span class="st-dot ${t.status === 'blocked' ? 'c-blocked' : t.status === 'in_progress' ? 'c-doing' : t.status === 'review' ? 'c-review' : 'c-todo'}"></span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(t.title)}</span>
          <span class="who">${esc(whoName(t.assignee))}</span>
        </div>`).join('') : '<div class="pending-empty">全部闭合，没有在途事项</div>'}
    </div>

      <div class="panel-title">最近发生</div>
      <div class="ev-list">
        ${recentN.length ? recentN.map(m => `
          <div class="ev-item">

    </div>`;

/* ===== 交付物预览（v2.20.6）=====
   托管 Agent 每次 write/edit/present 都由 server 记进 dsh_artifacts.json，
   这里把登记表列出来，点一条就地预览——不用再去磁盘里翻。 */
let ART_CUR = null;          // 当前预览的交付物条目
const ART_ICON = { image: '🖼', markdown: '📝', pdf: '📕', html: '🌐', video: '🎬',
                   audio: '🎵', json: '🧾', text: '📄', code: '⌨️', office: '📊', other: '📦' };
const ART_TEXTUAL = { markdown: 1, json: 1, text: 1, code: 1, html: 1 };

function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function artUrl(a, download) {
  return '/api/dsh/artifact?project=' + encodeURIComponent(PROJECT) +
    '&agent=' + encodeURIComponent(a.agentId) +
    '&path=' + encodeURIComponent(a.path) + (download ? '&download=1' : '');
}

async function loadArtifacts() {
  const box = document.getElementById('artList');
  if (!box) return;
  const cnt = document.getElementById('artCount');
  const agent = currentDshAgent;
  if (!agent) { if (cnt) cnt.textContent = ''; return; }
  try {
    const r = await fetch('/api/dsh/artifacts?project=' + encodeURIComponent(PROJECT) +
                          '&agent=' + encodeURIComponent(agent));
    const j = await r.json();
    const items = (j && j.artifacts) || [];
    if (cnt) cnt.textContent = '· ' + items.length;
    if (!items.length) {
      box.innerHTML = '<div class="work-empty">还没有登记到交付物<br><span style="font-size:11px;color:var(--dim-2);">Agent 用 write / edit 写文件后会自动出现（需重启过 server）</span></div>';
      return;
    }
    box.innerHTML = items.map((a, i) => `
      <div class="art-item ${a.previewable ? '' : 'art-gone'}" onclick="openArtifactPreview(${i})" title="${esc(a.path)}">
        <span class="art-kind">${ART_ICON[a.kind] || '📦'}</span>
        <span class="art-name">${esc(a.name)}</span>
        <span class="art-meta">${a.previewable ? fmtBytes(a.size) : (a.exists ? '不可预览' : '已不在')}</span>
        ${a.previewable ? `<span class="art-open" title="在新标签页打开" onclick="event.stopPropagation();openArtifactRawIdx(${i})">↗</span>` : ''}
      </div>`).join('');
    box.dataset.items = JSON.stringify(items);
  } catch (e) {
    box.innerHTML = '<div class="work-empty">读取失败：' + esc(String(e)) + '</div>';
  }
}

function _artItems() {
  const box = document.getElementById('artList');
  try { return JSON.parse(box.dataset.items || '[]'); } catch (e) { return []; }
}

function openArtifactPreview(idx) {
  const a = _artItems()[idx];
  if (!a) return;
  ART_CUR = a;
  const box = document.getElementById('artPreview');
  document.getElementById('artPvTitle').textContent = a.name;
  document.getElementById('artPvPath').textContent = a.rel || a.path;
  const dl = document.getElementById('artPvDl');
  const op = document.getElementById('artPvOpen');
  dl.style.display = op.style.display = a.exists ? '' : 'none';
  const body = document.getElementById('artPvBody');
  body.innerHTML = '';
  if (!a.exists) {
    body.innerHTML = '<div class="art-pv-fallback"><span class="big">🕳</span>文件已不在磁盘上（可能被移动或删除）<br><span style="font-size:11px;font-family:var(--mono);">' + esc(a.path) + '</span></div>';
    box.classList.add('show');
    return;
  }
  if (a.previewable === false) {
    body.innerHTML = '<div class="art-pv-fallback"><span class="big">🚫</span>这个文件没法在界面里预览<br>' +
      esc(a.reason || '路径不在允许预览的目录内') +
      '<br><span style="font-size:11px;font-family:var(--mono);">' + esc(a.path) + '</span></div>';
    box.classList.add('show');
    return;
  }
  const url = artUrl(a);
  const k = a.kind;
  if (k === 'image') {
    body.innerHTML = '<img src="' + url + '" alt="' + esc(a.name) + '">';
    const img = body.querySelector('img');
    if (img) {
      // 小图（图标/精灵图/贴图切片）默认会缩成几个像素看不见——放大到能看清
      img.addEventListener('load', () => {
        const w = img.naturalWidth, h = img.naturalHeight;
        if (!w || !h) return;
        if (w < 220 && h < 220) {
          const k = Math.max(1, Math.min(8, Math.floor(420 / Math.max(w, h))));
          if (k > 1) {
            img.style.width = (w * k) + 'px';
            img.style.height = (h * k) + 'px';
            if (k >= 3) img.style.imageRendering = 'pixelated';
          }
        }
      });
      img.addEventListener('error', () => {
        body.innerHTML = '<div class="art-pv-fallback"><span class="big">🖼</span>图片加载失败<br><span style="font-size:11px;">点「新标签页」可直接打开原始文件</span></div>';
      });
    }
  } else if (k === 'pdf') {
    body.innerHTML = '<iframe src="' + url + '" title="pdf"></iframe>';
  } else if (k === 'html') {
    body.innerHTML = '<iframe src="' + url + '" sandbox="allow-same-origin" title="html"></iframe>';
  } else if (k === 'video') {
    body.innerHTML = '<video src="' + url + '" controls autoplay style="max-height:100%;"></video>';
  } else if (k === 'audio') {
    body.innerHTML = '<audio src="' + url + '" controls autoplay></audio>';
  } else if (k === 'office') {
    body.innerHTML = '<div class="art-pv-fallback"><span class="big">📊</span>Office 文档暂不支持内嵌预览<br>点右上角「下载」用本地应用打开</div>';
  } else if (k === 'other') {
    body.innerHTML = '<div class="art-pv-fallback"><span class="big">📦</span>这个类型没法预览<br>点右上角「下载」或「新标签页」试试</div>';
  } else {
    body.innerHTML = '<pre>读取中…</pre>';
    fetch(url).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 403 ? '（不在允许预览的目录内）' : ''));
      return r.text();
    }).then(txt => {
      if (ART_CUR !== a) return;
      if (k === 'markdown') body.innerHTML = '<div class="art-md">' + renderMiniMarkdown(txt) + '</div>';
      else if (k === 'json') body.innerHTML = '<pre class="with-ln">' + esc(prettyJson(txt)) + '</pre>';
      else body.innerHTML = '<pre class="with-ln">' + esc(txt).split('\n').map((ln, i) =>
        '<span class="art-ln">' + (i + 1) + '</span>' + ln).join('\n') + '</pre>';
    }).catch(e => { body.innerHTML = '<pre>读取失败：' + esc(String(e)) + '</pre>'; });
  }
  box.classList.add('show');
}

function prettyJson(txt) {
  try { return JSON.stringify(JSON.parse(txt), null, 2); } catch (e) { return txt; }
}

/* 极简 markdown 渲染：标题/粗体/行内码/围栏码/列表/引用/链接/分割线/表格。
   刻意不引第三方库（本项目零依赖），够看 Agent 交付的说明文档即可。 */
function renderMiniMarkdown(src) {
  const fences = [];
  let t = String(src == null ? '' : src).replace(/\r\n?/g, '\n');
  t = t.replace(/```[^\n]*\n([\s\S]*?)```/g, (m, code) => {
    fences.push(code); return '\u0000F' + (fences.length - 1) + '\u0000';
  });
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  const lines = t.split('\n');
  const out = [];
  let listKind = null, inQuote = false, tbl = [];
  const closeList = () => { if (listKind) { out.push('</' + listKind + '>'); listKind = null; } };
  const closeQuote = () => { if (inQuote) { out.push('</blockquote>'); inQuote = false; } };
  const flushTable = () => {
    if (!tbl.length) return;
    const rows = tbl.filter(r => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r));
    if (rows.length) {
      const cells = (r) => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      let h = '<table><thead><tr>' + cells(rows[0]).map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
      h += rows.slice(1).map(r => '<tr>' + cells(r).map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('');
      out.push(h + '</tbody></table>');
    }
    tbl = [];
  };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (/^\s*\|.*\|\s*$/.test(line)) { closeList(); closeQuote(); tbl.push(line); continue; }
    flushTable();
    const f = line.match(/^\u0000F(\d+)\u0000$/);
    if (f) { closeList(); closeQuote(); out.push('<pre><code>' + esc(fences[+f[1]] || '') + '</code></pre>'); continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeList(); closeQuote(); const lv = Math.min(h[1].length, 3); out.push('<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>'); continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { closeList(); closeQuote(); out.push('<hr>'); continue; }
    const q = line.match(/^>\s?(.*)$/);
    if (q) { closeList(); if (!inQuote) { out.push('<blockquote>'); inQuote = true; } out.push('<p>' + inline(q[1]) + '</p>'); continue; }
    closeQuote();
    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*(\d+)[.)]\s+(.*)$/);
    if (ul || ol) {
      const kind = ol ? 'ol' : 'ul';
      if (listKind && listKind !== kind) closeList();          // 有序/无序切换要换标签
      if (!listKind) {
        const start = (ol && ol[1] !== '1') ? ' start="' + ol[1] + '"' : '';
        out.push('<' + kind + start + '>'); listKind = kind;
      }
      let body = ol ? ol[2] : ul[1];
      const task = body.match(/^\[([ xX])\]\s+(.*)$/);          // v2.20.13：- [x] 待办清单
      let liCls = '';
      if (task) { liCls = ' class="md-task"'; body = '<input type="checkbox" disabled' + (task[1].toLowerCase() === 'x' ? ' checked' : '') + '> ' + inline(task[2]); }
      else body = inline(body);
      out.push('<li' + liCls + '>' + body + '</li>');
      continue;
    }
    closeList();
    if (!line.trim()) { out.push(''); continue; }
    out.push('<p>' + inline(line) + '</p>');
  }
  closeList(); closeQuote(); flushTable();
  return out.join('\n');
}

/* ===== 人卡内可拖动分隔条（v2.20.6）=====
   竖条：基本信息 | 聊天；横条：对话记录 | 终端聊天。比例记在本地。 */
function initPersonSplitters() {
  const card = document.getElementById('personCard');
  if (!card) return;
  const left = card.querySelector('.person-left');
  const chatList = document.getElementById('chatList');
  const sV = document.getElementById('splitPerson');
  const sH = document.getElementById('splitChat');
  const KEY = 'agentnexus_person_split';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  const chatMax = () => Math.max(80, window.innerHeight - 340);
  if (left && saved.left) {
    const w = Math.max(240, Math.min(760, saved.left));
    left.style.flex = '0 0 ' + w + 'px'; left.style.maxWidth = w + 'px';
  }
  if (chatList && saved.chat) {
    const h = Math.max(60, Math.min(chatMax(), saved.chat));
    chatList.style.flex = '0 0 ' + h + 'px';
  }
  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        left: left ? Math.round(left.getBoundingClientRect().width) : 0,
        chat: chatList ? Math.round(chatList.getBoundingClientRect().height) : 0
      }));
    } catch (e) {}
  }
  function bind(splitter, axis, getBase, apply, lo, hi) {
    if (!splitter) return;
    splitter.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      try { splitter.setPointerCapture(e.pointerId); } catch (err) {}
      splitter.classList.add('dragging');
      document.body.classList.add(axis === 'x' ? 'col-resizing' : 'row-resizing');
      const start = axis === 'x' ? e.clientX : e.clientY;
      const base = getBase();
      const onMove = (ev) => {
        const cur = axis === 'x' ? ev.clientX : ev.clientY;
        apply(Math.max(lo, Math.min(hi(), base + (cur - start))));
      };
      const onUp = () => {
        splitter.classList.remove('dragging');
        document.body.classList.remove(axis === 'x' ? 'col-resizing' : 'row-resizing');
        splitter.removeEventListener('pointermove', onMove);
        splitter.removeEventListener('pointerup', onUp);
        splitter.removeEventListener('pointercancel', onUp);
        persist();
      };
      splitter.addEventListener('pointermove', onMove);
      splitter.addEventListener('pointerup', onUp);
      splitter.addEventListener('pointercancel', onUp);
    });
    splitter.addEventListener('dblclick', () => {
      if (axis === 'x' && left) { left.style.flex = ''; left.style.maxWidth = ''; }
      if (axis === 'y' && chatList) chatList.style.flex = '';
      persist();
    });
  }
  bind(sV, 'x',
    () => (left ? left.getBoundingClientRect().width : 340),
    (w) => { left.style.flex = '0 0 ' + w + 'px'; left.style.maxWidth = w + 'px'; },
    240, () => 760);
  bind(sH, 'y',
    () => (chatList ? chatList.getBoundingClientRect().height : 200),
    (h) => { chatList.style.flex = '0 0 ' + h + 'px'; },
    60, chatMax);
}

async function renameAgent(agentId) {
  const a = agentById[agentId];
  if (!a) return;
  const name = prompt('给成员改个名字（id 不变，接入不受影响）：', a.name || agentId);
  if (name === null || !name.trim()) return;
  const resp = await fetch('/api/agents/update' + (PROJECT ? `?project=${encodeURIComponent(PROJECT)}` : ''), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ agent_id: agentId, name: name.trim() })
  });
  const r = await resp.json();
  if (r.ok) {
    await loadBoard(); closePerson();
    if (r.is_guide && r.guide) showInvite(name.trim(), 'guide', r.guide);
  } else alert(r.error || '改名失败');
}

  const a = agentById[agentId];

}

async function regenGuide(agentId) {

  const resp = await fetch('/api/agents/update' + (PROJECT ? `?project=${encodeURIComponent(PROJECT)}` : ''), {

async function removeAgent(agentId) {
  const a = agentById[agentId];
  if (!a) return;
  const open = tasksOf(agentId).filter(t => t.status !== 'done').length;
  const msg = `确定移除「${a.name || agentId}」？`
    + (open ? `\n它名下有 ${open} 个未完成任务，将转为无人认领。` : '')
    + '\n移除后其下属成员会提升为顶层，历史消息保留。';
  if (!confirm(msg)) return;
  const resp = await fetch('/api/agents/remove' + (PROJECT ? `?project=${encodeURIComponent(PROJECT)}` : ''), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ agent_id: agentId })
  });
  const r = await resp.json();
  if (r.ok) { await loadBoard(); closePerson(); }
  else alert(r.error || '移除失败');
}

async function saveRelation(agentId) {
  const v = document.getElementById('relSelect').value;
  const resp = await fetch('/api/org/relation' + (PROJECT ? `?project=${encodeURIComponent(PROJECT)}` : ''), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ relations: [{ agent_id: agentId, reports_to: v }] })
  });
  const r = await resp.json();
  if (r.ok) { await loadBoard(); closePerson(); }
  else alert(r.error || '保存失败');
}

async function sendMsgTo(agentId) {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  const resp = await fetch('/api/messages' + (PROJECT ? `?project=${encodeURIComponent(PROJECT)}` : ''), {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sender: 'user', content: '@' + agentId + ' ' + text })
  });
  const r = await resp.json();
  if (r.ok) { input.value = ''; await loadBoard(); openPerson(agentId); }
  else alert(r.error || '发送失败');
}

/* ===== 终端会话（v2.15 dsh 进程托管）===== */
function isTerminalAgent(a) {
  return a && (a.id === 'terminal' || (a.role || '').includes('终端') || a.entry_type === 'dsh' || (a.entry && a.entry.type === 'dsh'));
}
let currentDshAgent = '';  // 当前打开的终端托管成员 id（会话历史按成员隔离）
let dshMsgsCache = [];      // v2.17：聊天历史缓存（打开卡片时从服务端加载，发送/回复时内存追加）
let dshServerUsage = {};   // 服务端累计用量（project_config dsh.members.<id>.usage）
function dshHistory() { return dshMsgsCache; }
function dshTotalTokens() { return dshServerUsage.totalTokens || 0; }
function fmtTokens(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }
async function loadDshHistory() {
  // v2.17：从项目目录持久化文件加载该成员聊天历史（跨浏览器/设备可追溯）
  const box = document.getElementById('dshMsgs');
  const usageEl = document.getElementById('dshUsage');
  if (!box) return;
  try {
    const resp = await fetch('/api/dsh/history' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : '') + '&agent=' + encodeURIComponent(currentDshAgent || 'terminal'));
    const j = await resp.json();
    if (!j.ok) throw new Error(j.error || '加载失败');
    dshServerUsage = j.total_usage || {};
    dshMsgsCache = j.history || [];
    const h = dshMsgsCache.slice(-30);
    box.innerHTML = h.length ? h.map(m => dshMsgHtml(m.role, m.content)).join('') : '<div class="work-empty" style="padding:10px 0;">还没有对话 —— 直接在下方输入指令，终端 Agent 会实时回复并操作看板。</div>';
    scrollToBottom(box);  // v2.20.4：打开卡片时滚动到最近消息
    if (usageEl) usageEl.textContent = '用量：' + fmtTokens(dshTotalTokens());
  } catch (e) {
    box.innerHTML = '<div class="work-empty" style="padding:10px 0;">历史加载失败：' + esc2(e.message) + '</div>';
  }
}
function togglePersonFullscreen() {
  const m = document.getElementById('personModal');
  if (m) m.classList.toggle('fullscreen');
}
function esc2(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
// v2.20.13：托管成员的回复按 markdown 排版（表格 / 列表 / 代码块），
// 用户自己打的字保持原样——打什么看到什么，星号和竖线不会被吃掉。
function dshBody(role, content) {
  const text = String(content == null ? '' : content);
  if (role !== 'assistant') return { html: esc2(text), wide: false };
  const html = renderMiniMarkdown(text);
  return { html: '<div class="md">' + html + '</div>', wide: /<table/.test(html) };
}
function dshMsgHtml(role, content, whoOverride) {
  const cls = role === 'user' ? 'user' : (role === 'thinking' ? 'thinking' : 'assistant');
  const who = whoOverride || (role === 'user' ? '你' : '终端 Agent');
  const b = dshBody(role, content);
  return '<div class="dsh-msg ' + cls + (b.wide ? ' md-wide' : '') + '"><span class="who">' + who + '</span>' + b.html + '</div>';
}
// 流式更新：气泡已经在页面上，只换正文并同步「含表格放宽」这个状态
function dshSetBody(el, role, content) {
  if (!el) return;
  const b = dshBody(role, content);
  el.innerHTML = '<span class="who">终端 Agent</span>' + b.html;
  el.classList.toggle('md-wide', !!b.wide);
}
function renderDshHistory() {
  // v2.17：打开卡片时由 loadDshHistory() 从服务端加载；此函数仅用于同步兜底
  const h = dshHistory().slice(-30);
  if (!h.length) return '<div class="work-empty" style="padding:10px 0;">还没有对话 —— 直接在下方输入指令，终端 Agent 会实时回复并操作看板。</div>';
  return h.map(m => dshMsgHtml(m.role, m.content)).join('');
}
async function clearDshHistory() {
  if (!confirm('确定清空该成员的会话？历史记录与 Agent 记忆都会归零。')) return;
  try {
    const resp = await fetch('/api/dsh/history/clear' + (PROJECT ? '?project=' + encodeURIComponent(PROJECT) : '') + '&agent=' + encodeURIComponent(currentDshAgent || 'terminal'), { method: 'POST' });
    const j = await resp.json();
    if (!j.ok) throw new Error(j.error || '清空失败');
    dshMsgsCache = [];
    dshServerUsage = {};
    document.getElementById('dshMsgs').innerHTML = '<div class="work-empty" style="padding:10px 0;">会话已清空 —— 下一轮消息将从新上下文开始。</div>';
    document.getElementById('dshUsage').textContent = '用量：0';
  } catch (e) { alert('清空失败：' + e.message); }
}
function dshAppend(role, content) {
  const box = document.getElementById('dshMsgs');

  box.scrollTop = box.scrollHeight;

// v2.19.3：思考过程折叠块（默认收起，点开看完整推导）
function appendThinking(text) {

}
async function loadDshModel(sel) {

// ===== v2.20.7：托管成员自动唤醒开关 =====
